    if (!(valorImovel > 0)) erros.push({ campo: 'valorImovel', msg: 'Informe o valor do imóvel.' });
    if (!(renda > 0)) erros.push({ campo: 'renda', msg: 'Informe a renda familiar mensal bruta.' });
    if (nMensais < 0 || (nAnuais !== null && nAnuais < 0)) erros.push({ campo: 'parcelas', msg: 'Quantidade de parcelas inválida.' });

    // ---------- 1) Financiamento ----------
    const param = p || {};
    const temParam = num(param.taxaAnual) >= 0 && int(param.prazoMaxMeses) > 0 && num(param.comprometimentoMax) > 0;
    const baseFin = valorAvaliacao > 0 ? valorAvaliacao : valorImovel;
    if (!(valorAvaliacao > 0)) avisos.push({ campo: 'valorAvaliacao', msg: 'Valor de avaliação não informado: o cálculo usou o valor do imóvel como base. Confirme a avaliação com o banco.' });

    let prazo = int(param.prazoMaxMeses);
    const idade = num(e.idade);
    if (idade > 0 && int(param.idadeLimiteMeses) > 0) {
      const restante = int(param.idadeLimiteMeses) - Math.ceil(idade * 12);
      if (restante < prazo) {
        prazo = Math.max(0, restante);
        premissas.push(`Prazo limitado pela idade do proponente mais velho (${idade} anos): ${prazo} meses.`);
      }
    }
    if (int(e.prazoMeses) > 0) {
      if (temParam && int(e.prazoMeses) > prazo) erros.push({ campo: 'prazoMeses', msg: `Prazo acima do máximo permitido (${prazo} meses).` });
      prazo = int(e.prazoMeses);
    }
    if (renda > 0 && num(param.rendaMax) > 0 && renda > num(param.rendaMax))
      avisos.push({ campo: 'renda', msg: `Renda acima do limite do parâmetro "${param.nome || 'selecionado'}" (${fmt(param.rendaMax)}). Verifique o enquadramento.` });
    if (renda > 0 && num(param.rendaMin) > 0 && renda < num(param.rendaMin))
      avisos.push({ campo: 'renda', msg: `Renda abaixo da faixa do parâmetro "${param.nome || 'selecionado'}" (a partir de ${fmt(param.rendaMin)}). Verifique o enquadramento.` });
    if (num(param.tetoImovel) > 0 && valorImovel > num(param.tetoImovel))
      avisos.push({ campo: 'valorImovel', msg: `Valor do imóvel acima do teto do parâmetro (${fmt(param.tetoImovel)}).` });
    const taxaAnual = num(e.taxaAnual) > 0 ? num(e.taxaAnual) : num(param.taxaAnual);
    const i = taxaMensal(taxaAnual);

    let finRenda = null, finCota = null, finCalculado = null, prestacaoMaxRenda = null;
    if (temParam && renda > 0 && prazo > 0) {
      prestacaoMaxRenda = r2(renda * num(param.comprometimentoMax));
      finRenda = Math.floor(pvPrice(prestacaoMaxRenda, i, prazo) * 100) / 100;
      finCota = num(param.cotaMax) > 0 ? r2(baseFin * num(param.cotaMax)) : null;
      finCalculado = Math.min(finRenda, finCota === null ? Infinity : finCota, valorImovel);
      finCalculado = Math.floor(finCalculado * 100) / 100;
      premissas.push(`Tabela Price, taxa nominal de ${String(taxaAnual).replace('.', ',')}% a.a. (${(i * 100).toFixed(4).replace('.', ',')}% a.m.), prazo de ${prazo} meses.`);
      premissas.push(`Prestação limitada a ${(num(param.comprometimentoMax) * 100).toFixed(0)}% da renda; financiamento limitado a ${num(param.cotaMax) ? (num(param.cotaMax) * 100).toFixed(0) + '% da avaliação' : 'sem cota cadastrada'}.`);
      premissas.push('Não inclui seguros (MIP/DFI) nem taxa de administração: a prestação real tende a ser maior.');
    }

    let financiamento;
    const modo = e.financiamentoModo === 'informado' ? 'informado' : 'calculado';
    if (modo === 'informado') {
      financiamento = num(e.financiamentoInformado);
      if (!(financiamento >= 0) || Number.isNaN(financiamento)) erros.push({ campo: 'financiamentoInformado', msg: 'Informe o valor do financiamento.' });
      if (finRenda !== null && financiamento > finRenda + 0.01) avisos.push({ campo: 'financiamentoInformado', msg: `Valor informado acima do limite estimado pela renda (${fmt(finRenda)}). Depende de aprovação bancária.` });
      if (finCota !== null && financiamento > finCota + 0.01) avisos.push({ campo: 'financiamentoInformado', msg: `Valor informado acima da cota de ${(num(param.cotaMax) * 100).toFixed(0)}% da avaliação (${fmt(finCota)}).` });
    } else {
      if (finCalculado === null) {
        financiamento = 0;
        erros.push({ campo: 'parametro', msg: 'Sem parâmetros financeiros completos (taxa, prazo e comprometimento): informe o valor do financiamento manualmente.' });
      } else financiamento = finCalculado;
    }
    if (financiamento > valorImovel) erros.push({ campo: 'financiamentoInformado', msg: 'O financiamento não pode ser maior que o valor do imóvel.' });
    financiamento = r2(financiamento || 0);

    const prestacao = prazo > 0 && financiamento > 0 && taxaAnual >= 0 && (temParam || num(e.taxaAnual) > 0) ? r2(pmtPrice(financiamento, i, prazo)) : null;

    // ---------- 2) Entrada (só depois do financiamento definido) ----------
    const entrada = r2(valorImovel - financiamento);
    const limiteAnual = r2(renda * num(regras.limiteAnualPctRenda));

    if (fgtsUsado > fgtsSaldo + 0.001) erros.push({ campo: 'fgtsUsado', msg: `FGTS utilizado (${fmt(fgtsUsado)}) maior que o saldo disponível (${fmt(fgtsSaldo)}).` });
    if (regras.sinalMinPct && entrada > 0 && sinal < r2(valorImovel * num(regras.sinalMinPct)) - 0.01)
      avisos.push({ campo: 'sinal', msg: `Sinal abaixo do mínimo da condição comercial (${(num(regras.sinalMinPct) * 100).toFixed(0)}% do imóvel = ${fmt(valorImovel * num(regras.sinalMinPct))}).` });

    const sinalAcimaLimite = entrada > 0 && sinal > r2(entrada * num(regras.sinalLimiteAnuaisPct));
    const anuaisSugeridas = sinalAcimaLimite ? 0 : int(regras.anuaisSugeridas);
    if (sinalAcimaLimite && nAnuais > 0)
      avisos.push({ campo: 'nAnuais', msg: `O sinal passa de ${(num(regras.sinalLimiteAnuaisPct) * 100).toFixed(0)}% da entrada: pela regra do simulador, as parcelas anuais não deveriam ser previstas.` });

    if (nAnuais === null) erros.push({ campo: 'nAnuais', msg: 'Responda quantas parcelas anuais deseja incluir.' });
    if (regras.maxAnuais !== null && regras.maxAnuais !== undefined && nAnuais > int(regras.maxAnuais)) erros.push({ campo: 'nAnuais', msg: `Máximo de ${regras.maxAnuais} parcelas anuais neste empreendimento.` });
    if (regras.maxMensais !== null && regras.maxMensais !== undefined && nMensais > int(regras.maxMensais)) erros.push({ campo: 'nMensais', msg: `Máximo de ${regras.maxMensais} parcelas mensais neste empreendimento.` });

    const saldoAposSinalFgts = r2(entrada - subsidio - recursos - sinal - fgtsUsado);

    let valorAnual = 0;
    const qAnuais = nAnuais || 0;
    if (qAnuais > 0) {
      if (e.anualModo === 'informado') {
        valorAnual = r2(num(e.anualValor));
        if (!(valorAnual > 0)) erros.push({ campo: 'anualValor', msg: 'Informe o valor de cada parcela anual.' });
      } else {
        // Automático: o máximo permitido, sem passar do saldo.
        valorAnual = Math.floor(Math.max(0, Math.min(limiteAnual, saldoAposSinalFgts / qAnuais)) * 100) / 100;
      }
      if (valorAnual > limiteAnual + 0.001) {
        erros.push({ campo: 'anualValor', msg: `Cada parcela anual (${fmt(valorAnual)}) ultrapassa o limite de ${(num(regras.limiteAnualPctRenda) * 100).toFixed(0)}% da renda mensal (${fmt(limiteAnual)}). Excesso de ${fmt(valorAnual - limiteAnual)} por parcela.` });
      }
    }
    const totalAnuais = r2(valorAnual * qAnuais);

    const restanteMensais = r2(saldoAposSinalFgts - totalAnuais);
    let valorMensal = 0, totalMensais = 0, ajusteCentavos = 0;
    if (nMensais > 0 && restanteMensais > 0) {
      valorMensal = Math.floor((restanteMensais / nMensais) * 100) / 100;
      totalMensais = r2(valorMensal * nMensais);
      ajusteCentavos = r2(restanteMensais - totalMensais); // vai na última parcela
      totalMensais = r2(totalMensais + ajusteCentavos);
    }

    const soma = r2(subsidio + recursos + sinal + fgtsUsado + totalAnuais + totalMensais);
    const diferenca = r2(entrada - soma); // >0 falta; <0 excede
    if (entrada < 0) erros.push({ campo: 'financiamentoInformado', msg: 'O financiamento passou do valor do imóvel.' });
    if (Math.abs(diferenca) > 0.009) {
      erros.push({
        campo: 'composicao',
        msg: diferenca > 0
          ? `Ajuste necessário: faltam ${fmt(diferenca)} para fechar a entrada${nMensais === 0 ? ' (inclua parcelas mensais ou aumente outro componente)' : ''}.`
          : `Ajuste necessário: os componentes excedem a entrada em ${fmt(-diferenca)}.`
      });
    }

    const comprometimentoMensalEntrada = renda > 0 ? valorMensal / renda : null;
    const anualSobreRenda = renda > 0 && qAnuais > 0 ? valorAnual / renda : null;

    const conferida = erros.length === 0;
    return {
      versaoMotor: '1.0.0',
      regras,
      financiamento: {
        modo, base: valorAvaliacao > 0 ? 'avaliacao' : 'valor_imovel', baseValor: baseFin,
        taxaAnual, taxaMensal: i, prazo, prestacaoMaxRenda, finRenda, finCota, finCalculado,
        valor: financiamento, prestacao,
        comprometimentoPrestacao: prestacao && renda ? prestacao / renda : null,
        temParametros: temParam
      },
      valores: {
        valorImovel, valorAvaliacao, renda, fgtsSaldo, fgtsUsado, sinal, subsidio, recursosProprios: recursos,
        entrada, percentualFinanciado: valorImovel ? financiamento / valorImovel : 0,
        percentualEntrada: valorImovel ? entrada / valorImovel : 0,
        recursosPropriosTotal: r2(recursos + sinal + totalAnuais + totalMensais),
        saldoAposSinalFgts
      },
      entrada: {
        limiteAnual, anuaisSugeridas, sinalAcimaLimite,
        nAnuais: qAnuais, valorAnual, totalAnuais,
        nMensais, valorMensal, totalMensais, ajusteCentavos, restanteMensais,
        soma, diferenca, totalParcelas: qAnuais + nMensais
      },
      indicadores: { comprometimentoMensalEntrada, anualSobreRenda },
      componentes: [
        subsidio > 0 && { tipo: 'subsidio', rotulo: 'Subsídio habitacional', quantidade: null, unitario: null, total: subsidio },
        recursos > 0 && { tipo: 'recursos', rotulo: 'Outros recursos próprios', quantidade: null, unitario: null, total: recursos },
        sinal > 0 && { tipo: 'sinal', rotulo: 'Sinal', quantidade: 1, unitario: sinal, total: sinal },
        fgtsUsado > 0 && { tipo: 'fgts', rotulo: 'FGTS', quantidade: null, unitario: null, total: fgtsUsado },
        totalMensais > 0 && { tipo: 'mensais', rotulo: 'Parcelas mensais', quantidade: nMensais, unitario: valorMensal, total: totalMensais },
        totalAnuais > 0 && { tipo: 'anuais', rotulo: 'Parcelas anuais', quantidade: qAnuais, unitario: valorAnual, total: totalAnuais }
      ].filter(Boolean),
      status: conferida ? 'conferida' : 'ajuste',
      erros, avisos, premissas
    };
  }

  function fmt(v) {
    const n = Number(v) || 0;
    return 'R$ ' + n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  // Média estimada da taxa de obras (juros de evolução de obra): juros mensais do contrato
  // sobre metade do valor financiado, que é liberado aos poucos durante a obra. Sem seguros e taxa de administração.
  function taxaObraMedia(f) {
    if (!f || !(f.valor > 0) || !(f.taxaAnual > 0)) return null;
    return r2(f.valor * 0.5 * taxaMensal(f.taxaAnual));
  }
  return { simular, pmtPrice, pvPrice, taxaMensal, fmt, num, r2, REGRAS_PADRAO, mesclarRegras, taxaObraMedia };
});

</script>
<script>
/* Gera o PDF da simulação no navegador (jsPDF), com o mesmo layout do portal completo. */
// Rótulos de torre/bloco/casa usados em todo o portal
window.rotTorre = (t) => { t = String(t ?? '—'); return /^\d+$/.test(t) ? `Torre ${t}` : /^[A-Z]$/.test(t) ? `Bloco ${t}` : t; };
window.rotUn = (torre, numero, sep = ', unidade ') => (String(torre) === 'Casas' ? `Casa ${numero}` : `${window.rotTorre(torre)}${sep}${numero}`);
(function () {
  'use strict';
  const COR = { vinho: '#AF2846', cinza: '#74746E', claro: '#EEEEEE', preto: '#0C0C0C', branco: '#FFFFFF', verde: '#2E7D4F', linha: '#DADAD6', zebra: '#F7F7F5' };
  const AVISO = 'Esta simulação possui caráter estimativo e não representa aprovação de crédito, garantia de financiamento, reserva de unidade ou compromisso de venda. As condições estão sujeitas à análise de crédito, às regras vigentes, à documentação do cliente e à confirmação dos valores e da disponibilidade do empreendimento.';
  const R = (v) => Calc.fmt(v);
  const pct = (v) => (v === null || v === undefined || !isFinite(v) ? '—' : (v * 100).toFixed(1).replace('.', ',') + '%');
  const dataISO = (d) => (d ? d.split('-').reverse().join('/') : '—');

  let fontes = null;
  async function carregarFontes() {
    if (fontes) return fontes;
    const b64 = (buf) => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
    const arqs = { MR: 'fonts/Montserrat_400Regular.ttf', MS: 'fonts/Montserrat_600SemiBold.ttf', MB: 'fonts/Montserrat_700Bold.ttf' };
    const out = {};
    for (const [k, u] of Object.entries(arqs)) {
      try { const r = await fetch(u); if (!r.ok) throw new Error(); out[k] = b64(await r.arrayBuffer()); } catch { out[k] = null; }
    }
    fontes = out; return out;
  }

  async function imagemCover(url, w, h) {
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const esc = 2, cw = Math.round(w * esc), ch = Math.round(h * esc);
      const c = document.createElement('canvas'); c.width = cw; c.height = ch;
      const r = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
      const dw = img.naturalWidth * r, dh = img.naturalHeight * r;
      c.getContext('2d').drawImage(img, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      return c.toDataURL('image/jpeg', 0.85);
    } catch { return null; }
  }

  async function gerar(sim, { portal, corretor }) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
    const f = await carregarFontes();
    const temFonte = f.MR && f.MS && f.MB;
    if (temFonte) {
      doc.addFileToVFS('MR.ttf', f.MR); doc.addFont('MR.ttf', 'MR', 'normal');
      doc.addFileToVFS('MS.ttf', f.MS); doc.addFont('MS.ttf', 'MS', 'normal');
      doc.addFileToVFS('MB.ttf', f.MB); doc.addFont('MB.ttf', 'MB', 'normal');
    }
    const fonte = (k) => (temFonte ? doc.setFont(k, 'normal') : doc.setFont('helvetica', k === 'MR' ? 'normal' : 'bold'));
    doc.setProperties({ title: `Simulação ${sim.codigo} — ${sim.cliente.nome}`, author: portal, subject: 'Simulação de financiamento imobiliário' });

    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const L = 48, CW = W - 96, BAIXO = H - 70;
    const snap = sim.snapshot || {}, emp = snap.empreendimento || {}, res = sim.resultado;
    const v = res.valores, fi = res.financiamento, en = res.entrada;
    const ajuste = res.status !== 'conferida';
    let y = 80;

    // Texto com quebra; y é o topo da caixa. Retorna o y abaixo do texto.
    function T(str, x, yy, o = {}) {
      const s = o.s || 10, w = o.w || CW, lh = o.lh || 1.35;
      fonte(o.f || 'MR'); doc.setFontSize(s); doc.setTextColor(o.c || COR.preto);
      if (o.sp) doc.setCharSpace(o.sp);
      let linhas = o.uma ? [String(str)] : doc.splitTextToSize(String(str ?? ''), w);
      if (o.uma || o.max) {
        const max = o.uma ? 1 : o.max;
        if (linhas.length > max) linhas = linhas.slice(0, max);
        const ult = linhas.length - 1;
        if (doc.getTextWidth(linhas[ult]) > w || (o.max && doc.splitTextToSize(String(str), w).length > max)) {
          let t = linhas[ult]; while (t.length > 1 && doc.getTextWidth(t + '…') > w) t = t.slice(0, -1); linhas[ult] = t + (t === linhas[ult] ? '' : '…');
          if (o.max && doc.splitTextToSize(String(str), w).length > max && !linhas[ult].endsWith('…')) linhas[ult] = linhas[ult].replace(/\s*\S*$/, '') + '…';
        }
      }
      const base = yy + s * 0.82;
      linhas.forEach((ln, i) => {
        const by = base + i * s * lh;
        if (o.align === 'right') doc.text(ln, x + w, by, { align: 'right' }); else doc.text(ln, x, by);
      });
      if (o.sp) doc.setCharSpace(0);
      return yy + linhas.length * s * lh;
    }
    const rect = (x, yy, w, h, cor, r = 0) => { doc.setFillColor(cor); if (r) doc.roundedRect(x, yy, w, h, r, r, 'F'); else doc.rect(x, yy, w, h, 'F'); };
    const linha = (x1, y1, x2, cor = COR.linha) => { doc.setDrawColor(cor); doc.setLineWidth(0.5); doc.line(x1, y1, x2, y1); };
    const novaPagina = () => { doc.addPage(); y = 80; };
    const garantir = (h) => { if (y + h > BAIXO) novaPagina(); };
    const titulo = (t, sub) => {
      y = T(t, L, y, { f: 'MB', s: 18 });
      if (sub) y = T(sub, L, y + 3, { s: 9.5, c: COR.cinza });
      y += 8; rect(L, y, 36, 3, COR.vinho); y += 16;
    };
    function linhaTab(cols, ws, yy, o = {}) {
      const h = o.h || 24; let x = L;
      if (o.fundo) rect(L, yy, CW, h, o.fundo);
      cols.forEach((c, k) => {
        T(c, x + 8, yy + (h - (o.s || 9.5)) / 2 - 1, { f: o.f || (k === 0 ? 'MS' : 'MR'), s: o.s || 9.5, c: o.c || COR.preto, w: ws[k] - 16, uma: true, align: k === 0 ? 'left' : 'right' });
        x += ws[k];
      });
      if (!o.semLinha) linha(L, yy + h, L + CW);
      return yy + h;
    }

    // ---------- Página 1 ----------
    y = T('PROPOSTA DE SIMULAÇÃO', L, y, { f: 'MS', s: 9, c: COR.vinho, sp: 1.5 });
    y = T(emp.nome || 'Imóvel', L, y + 4, { f: 'MB', s: 26, lh: 1.15 });
    y = T([emp.incorporadora, [emp.bairro, emp.cidade].filter(Boolean).join(', ')].filter(Boolean).join('  |  '), L, y + 2, { s: 10.5, c: COR.cinza });
    if (emp.endereco) y = T(emp.endereco, L, y + 2, { s: 8, c: COR.cinza });
    y += 12;
    if (emp.imagem) {
      const h = 230; const data = await imagemCover(emp.imagem, CW, h);
      if (data) { doc.addImage(data, 'JPEG', L, y, CW, h); y = T('Imagem do material oficial do empreendimento. Imagem ilustrativa.', L, y + h + 4, { s: 7, c: COR.cinza }) + 10; }
    }
    const yC = y; rect(L, yC, CW, 56, COR.claro);
    const colC = CW / 3;
    const campoC = (rot, val, x) => { T(rot.toUpperCase(), x + 12, yC + 10, { s: 7.5, c: COR.cinza, w: colC - 20, sp: 0.5 }); T(val, x + 12, yC + 24, { f: 'MS', s: 10, w: colC - 20, max: 2, lh: 1.2 }); };
    campoC('Cliente', sim.cliente.nome, L);
    campoC('Unidade / tipologia', [snap.unidade && rotUn(snap.unidade.torre, snap.unidade.numero, ', '), snap.tipologia && snap.tipologia.nome].filter(Boolean).join(' · ') || 'A definir', L + colC);
    campoC('Gerado em', new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }), L + 2 * colC);
    y = yC + 72;
    const ficha = emp.ficha || {}, tip = snap.tipologia;
    const area = (snap.unidade && snap.unidade.area) || (tip && tip.area);
    const caract = [
      area && ['Área privativa', `${String(area).replace('.', ',')} m²`],
      tip && tip.dormitorios !== null && tip.dormitorios !== undefined && ['Dormitórios', `${tip.dormitorios}${tip.suites ? ` (${tip.suites} suíte${tip.suites > 1 ? 's' : ''})` : ''}`],
      tip && tip.vagas !== null && tip.vagas !== undefined && ['Vagas', String(tip.vagas)],
      (snap.unidade && snap.unidade.entrega) ? ['Previsão de entrega', `${snap.unidade.entrega} (${rotTorre(snap.unidade.torre)})`] : emp.previsao_entrega && ['Previsão de entrega', emp.previsao_entrega],
      ficha.torres && ['Torres', ficha.torres], ficha.unidades && ['Unidades', ficha.unidades], emp.programa && ['Programa', emp.programa]
    ].filter(Boolean);
    if (caract.length) {
      const cw = CW / 4, y0 = y;
      caract.forEach(([rot, val], k) => {
        const x = L + (k % 4) * cw, yy = y0 + Math.floor(k / 4) * 46;
        T(rot.toUpperCase(), x, yy, { s: 7.5, c: COR.cinza, w: cw - 10, sp: 0.4 });
        T(val, x, yy + 12, { f: 'MS', s: 10.5, w: cw - 10, max: 2, lh: 1.2 });
      });
      y = y0 + Math.ceil(caract.length / 4) * 46 + 4;

        .forEach((l, k) => { y = linhaTab(l, ws5, y, { fundo: k % 2 ? null : COR.zebra, f: k === 4 ? 'MB' : undefined }); });

/* Simulação como imagem (PNG) e como texto para WhatsApp.
   Alternativa ao PDF para quem abre o portal sem permissão de download:
   a imagem pode ser salva ou compartilhada tocando e segurando sobre ela. */
(function () {
  'use strict';
  const COR = { vinho: '#AF2846', cinza: '#74746E', claro: '#EEEEEE', preto: '#0C0C0C', branco: '#FFFFFF', verde: '#2E7D4F', linha: '#DADAD6', zebra: '#F7F7F5' };
  const AVISO = 'Simulação estimativa: não representa aprovação de crédito, garantia de financiamento, reserva de unidade ou compromisso de venda. Condições sujeitas à análise de crédito, às regras vigentes e à confirmação dos valores e da disponibilidade.';
  const R = (v) => Calc.fmt(v);
  const pct = (v) => (v === null || v === undefined || !isFinite(v) ? '—' : (v * 100).toFixed(1).replace('.', ',') + '%');

  let fontesOk = null;
  async function fontes() {
    if (fontesOk !== null) return fontesOk;
    try {
      const fs = [['PImg', 'fonts/Montserrat_400Regular.ttf', '400'], ['PImg', 'fonts/Montserrat_600SemiBold.ttf', '600'], ['PImg', 'fonts/Montserrat_700Bold.ttf', '700']];
      for (const [n, u, w] of fs) { const f = new FontFace(n, `url(${u})`, { weight: w }); await f.load(); document.fonts.add(f); }
      fontesOk = true;
    } catch { fontesOk = false; }
    return fontesOk;
  }
  const carregarImg = (url) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = url; });

  function dadosSim(sim) {
    const snap = sim.snapshot || {}, emp = snap.empreendimento || {}, res = sim.resultado;
    const v = res.valores, fi = res.financiamento, en = res.entrada;
    const un = snap.unidade ? rotUn(snap.unidade.torre, snap.unidade.numero) : null;
    return { snap, emp, res, v, fi, en, un, tip: snap.tipologia, ajuste: res.status !== 'conferida' };
  }

  async function gerarImagem(sim, { portal, corretor }) {
    const temFonte = await fontes();
    const F = (w, s) => `${w} ${s}px ${temFonte ? 'PImg' : 'Arial, sans-serif'}`;
    const d = dadosSim(sim);
    const W = 1080, M = 64, CW = W - 2 * M;
    const foto = d.emp.imagem ? await carregarImg(d.emp.imagem) : null;

    // Desenha duas vezes: a primeira só mede a altura.
    const desenhar = (ctx) => {
      let y = 0;
      const txt = (s, x, yy, o = {}) => {
        ctx.font = F(o.w || 400, o.s || 26); ctx.fillStyle = o.c || COR.preto; ctx.textBaseline = 'top';
        const larg = o.larg || CW, lh = (o.s || 26) * (o.lh || 1.3);
        const palavras = String(s ?? '').split(/\s+/); const linhas = []; let atual = '';
        for (const p of palavras) { const t = atual ? atual + ' ' + p : p; if (ctx.measureText(t).width > larg && atual) { linhas.push(atual); atual = p; } else atual = t; }
        if (atual) linhas.push(atual);
        linhas.forEach((ln, i) => { if (o.dir) { ctx.textAlign = 'right'; ctx.fillText(ln, x + larg, yy + i * lh); ctx.textAlign = 'left'; } else ctx.fillText(ln, x, yy + i * lh); });
        return yy + linhas.length * lh;
      };
      const ret = (x, yy, w, h, c, r = 0) => { ctx.fillStyle = c; ctx.beginPath(); if (r && ctx.roundRect) ctx.roundRect(x, yy, w, h, r); else ctx.rect(x, yy, w, h); ctx.fill(); };

      ret(0, 0, W, 100000, COR.branco);
      ret(0, 0, W, 10, COR.vinho);
      y = 44;
      txt((portal || '').toUpperCase(), M, y, { w: 700, s: 20, c: COR.preto });
      txt(`${sim.codigo} · v${sim.versao}`, M, y, { s: 20, c: COR.cinza, dir: true });
      y += 52;
      if (foto) {
        const h = 400, r = Math.max(CW / foto.naturalWidth, h / foto.naturalHeight), dw = foto.naturalWidth * r, dh = foto.naturalHeight * r;
        ctx.save(); ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(M, y, CW, h, 18); else ctx.rect(M, y, CW, h); ctx.clip();
        ctx.drawImage(foto, M + (CW - dw) / 2, y + (h - dh) / 2, dw, dh); ctx.restore();
        y += h + 36;
      }
      y = txt('SIMULAÇÃO DE FINANCIAMENTO', M, y, { w: 600, s: 20, c: COR.vinho }) + 6;
      y = txt(d.emp.nome || 'Imóvel', M, y, { w: 700, s: 54, lh: 1.1 }) + 6;
      y = txt([d.emp.incorporadora, [d.emp.bairro, d.emp.cidade].filter(Boolean).join(', ')].filter(Boolean).join(' · '), M, y, { s: 24, c: COR.cinza }) + 26;

      // Cliente / unidade
      const linhasCli = [['Cliente', sim.cliente.nome], ['Unidade', [d.un, d.tip && d.tip.nome].filter(Boolean).join(' · ') || 'A definir'], ['Data', new Date().toLocaleDateString('pt-BR')]];
      const hCli = 26 + linhasCli.length * 44;
      ret(M, y, CW, hCli, COR.claro, 16);
      let yc = y + 22;
      for (const [k, val] of linhasCli) { txt(k, M + 24, yc, { s: 22, c: COR.cinza }); txt(val, M + 210, yc, { w: 600, s: 24, larg: CW - 234 }); yc += 44; }
      y += hCli + 30;

      // Destaques
      const cards = [['Valor do imóvel', R(d.v.valorImovel)], ['Financiamento', R(d.fi.valor)], ['Entrada', R(d.v.entrada)]];
      const cw = (CW - 32) / 3;
      cards.forEach(([rot, val], k) => {
        const x = M + k * (cw + 16);
        ret(x, y, cw, 128, k === 1 ? COR.preto : COR.claro, 16);
        txt(rot.toUpperCase(), x + 20, y + 24, { w: 600, s: 17, c: k === 1 ? '#BDBDB8' : COR.cinza, larg: cw - 40 });
        txt(val, x + 20, y + 62, { w: 700, s: 30, c: k === 1 ? COR.branco : k === 2 ? COR.vinho : COR.preto, larg: cw - 30 });
      });
      y += 128 + 40;

      // Parcelamento da entrada
      y = txt('Como fica a entrada', M, y, { w: 700, s: 32 }) + 16;
      const comps = d.res.componentes.filter((c) => c.total > 0.009);
      comps.forEach((c, k) => {
        if (k % 2 === 0) ret(M, y, CW, 64, COR.zebra, 10);
        txt(c.rotulo, M + 20, y + 18, { w: 600, s: 24, larg: CW * 0.5 });
        txt(c.quantidade && c.quantidade > 1 ? `${c.quantidade}x ${R(c.unitario)}` : R(c.total), M, y + 18, { s: 24, dir: true, larg: CW - 20 });
        y += 64;
      });
      ret(M, y, CW, 64, COR.claro, 10);
      txt('Total da entrada', M + 20, y + 18, { w: 700, s: 24 }); txt(R(d.en.soma), M, y + 18, { w: 700, s: 24, dir: true, larg: CW - 20 });
      y += 64 + 20;
      ret(M, y, CW, 64, d.ajuste ? COR.vinho : COR.verde, 12);
      txt(d.ajuste ? `AJUSTE NECESSÁRIO${d.en.diferenca > 0 ? ' — faltam ' + R(d.en.diferenca) : d.en.diferenca < 0 ? ' — excede em ' + R(-d.en.diferenca) : ''}` : 'COMPOSIÇÃO FINANCEIRA CONFERIDA', M + 24, y + 19, { w: 700, s: 23, c: COR.branco, larg: CW - 48 });
      y += 64 + 40;

      // Financiamento
      y = txt('Financiamento bancário', M, y, { w: 700, s: 32 }) + 16;
      const fin = [['Valor financiado', R(d.fi.valor)], ['Percentual financiado', pct(d.v.percentualFinanciado)]];
      if (d.fi.prestacao && d.fi.temParametros) fin.push(['Prestação estimada', R(d.fi.prestacao)], ['Taxa e prazo', `${String(d.fi.taxaAnual).replace('.', ',')}% a.a. · ${d.fi.prazo} meses (Price)`]);
      if (Calc.taxaObraMedia(d.fi)) fin.push(['Taxa de obras (média/mês)', R(Calc.taxaObraMedia(d.fi))]);
      if (d.v.subsidio) fin.push(['Subsídio aplicável', R(d.v.subsidio)]);
      if (d.v.fgtsUsado) fin.push(['FGTS na entrada', R(d.v.fgtsUsado)]);
      fin.push(['Renda familiar', R(d.v.renda)]);
      fin.forEach(([k, val], i) => {
        if (i % 2 === 0) ret(M, y, CW, 60, COR.zebra, 10);
        txt(k, M + 20, y + 16, { s: 24, c: COR.cinza, larg: CW * 0.45 }); txt(val, M, y + 16, { w: 600, s: 24, dir: true, larg: CW - 20 });
        y += 60;
      });
      y += 34;

      // Corretor e aviso
      if (corretor && corretor.nome) {
        y = txt('CORRETOR RESPONSÁVEL', M, y, { w: 600, s: 18, c: COR.cinza }) + 6;
        y = txt([corretor.nome, corretor.creci && `CRECI ${corretor.creci}`, corretor.telefone].filter(Boolean).join(' · '), M, y, { w: 700, s: 26 }) + 30;
      }
      ret(M, y, 6, 10, COR.vinho);
      const yAv = y; y = txt(AVISO, M + 26, y + 4, { s: 19, c: COR.cinza, lh: 1.45, larg: CW - 30 });
      ret(M, yAv, 6, y - yAv + 4, COR.vinho);
      y += 40;
      ret(0, y, W, 10, COR.vinho);
      return y + 10;
    };

    const medir = document.createElement('canvas').getContext('2d');
    medir.canvas.width = W; medir.canvas.height = 10;
    const H = Math.ceil(desenhar(medir));
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    desenhar(c.getContext('2d'));
    const url = c.toDataURL('image/png');
    const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
    return { url, blob };
  }

  function textoWhatsApp(sim, corretor) {
    const d = dadosSim(sim);
    const l = [];
    l.push(`🏠 *Simulação de financiamento: ${d.emp.nome || 'Imóvel'}*`);
    l.push(`Cliente: ${sim.cliente.nome}`);
    if (d.un || d.tip) l.push(`Unidade: ${[d.un, d.tip && d.tip.nome].filter(Boolean).join(' · ')}`);
    l.push('');
    l.push(`💰 Valor do imóvel: *${R(d.v.valorImovel)}*`);
    l.push(`🏦 Financiamento: *${R(d.fi.valor)}*${d.fi.prestacao && d.fi.temParametros ? ` (prestação estimada de ${R(d.fi.prestacao)})` : ''}`);
    l.push(`✅ Entrada: *${R(d.v.entrada)}*`);
    if (Calc.taxaObraMedia(d.fi)) l.push(`🏗️ Taxa de obras (média por mês durante a obra): *${R(Calc.taxaObraMedia(d.fi))}*`);
    l.push('');
    l.push('*Como fica a entrada*');
    for (const c of d.res.componentes.filter((x) => x.total > 0.009)) l.push(`• ${c.rotulo}: ${c.quantidade && c.quantidade > 1 ? `${c.quantidade}x de ${R(c.unitario)}` : R(c.total)}`);
    if (d.ajuste) l.push('', `⚠️ Composição com ajuste pendente${d.en.diferenca > 0 ? `: faltam ${R(d.en.diferenca)}` : d.en.diferenca < 0 ? `: excede em ${R(-d.en.diferenca)}` : ''}.`);
    l.push('', `_${AVISO}_`);
    if (corretor && corretor.nome) l.push('', [corretor.nome, corretor.creci && `CRECI ${corretor.creci}`, corretor.telefone].filter(Boolean).join(' · '));
    return l.join('\n');
  }

  window.GerarImagem = gerarImagem;
  window.TextoSimulacao = textoWhatsApp;
})();

<script>
/* Efeitos visuais: fundo animado, entrada escalonada, contadores, cards 3D, ondas nos botões e barra da composição. */
(function () {

      l.sort((a, b) => breve(a) - breve(b) || (o === 'preco' ? pv(a) - pv(b) : o === 'area' ? (b.area_max || 0) - (a.area_max || 0) : o === 'atual' ? String(b.tabela ? b.tabela.data_referencia : b.atualizado_em).localeCompare(String(a.tabela ? a.tabela.data_referencia : a.atualizado_em)) : a.nome.localeCompare(b.nome, 'pt-BR')));
      $('#contagem').textContent = `${l.length} de ${emps.length} empreendimento${emps.length === 1 ? '' : 's'}`;
      const lista = $('#lista'); lista.removeAttribute('aria-busy');
      if (!emps.length) lista.innerHTML = vazio('Nenhum empreendimento cadastrado', 'Os produtos aparecem aqui depois de cadastrados e publicados pelo administrador.', ehAdmin() ? '<a class="btn prim" href="#/admin/e/novo">Cadastrar empreendimento</a>' : '');

      const b = $('#limpar2'); if (b) b.onclick = () => { $('#filtros').reset(); $('#q').value = ''; aplicar(); };
      lista.style.display = l.length && emps.length ? '' : 'block';
    }
    $('#filtros').addEventListener('change', aplicar);
    $('#filtros').addEventListener('reset', () => setTimeout(aplicar));

    $('#q').oninput = aplicar;
    $('#abrir-filtros').onclick = (ev) => { const f = $('#filtros'); f.classList.toggle('aberto'); ev.currentTarget.setAttribute('aria-expanded', f.classList.contains('aberto')); };
    aplicar();
  }

  // ================= Galeria (lightbox) =================
  function lightbox(imgs, idx) {
    const el = document.createElement('div');
    el.className = 'lightbox'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    document.body.appendChild(el);
    const anterior = document.activeElement;
    const mostrar = () => {
      const i = imgs[idx];
      el.innerHTML = `<div class="barra"><div><b>${esc(i.titulo)}</b><div class="mpeq" style="color:#999">${idx + 1} de ${imgs.length}${i.origem ? ` — ${esc(i.origem)}` : ''}</div></div>
        <button class="btn peq" id="lb-x">${IC.fechar}Fechar</button></div>
        <div class="palco"><img src="${i.url}" alt="${esc(i.titulo)}">
        ${imgs.length > 1 ? `<button class="nav-l ant" aria-label="Anterior">${IC.voltar}</button><button class="nav-l prox" aria-label="Próxima">${IC.prox}</button>` : ''}</div>`;
      $('#lb-x', el).onclick = fechar; $('#lb-x', el).focus();
      const a = $('.ant', el), p = $('.prox', el);
      if (a) a.onclick = () => { idx = (idx - 1 + imgs.length) % imgs.length; mostrar(); };
      if (p) p.onclick = () => { idx = (idx + 1) % imgs.length; mostrar(); };
    };
    const tecla = (ev) => { if (ev.key === 'Escape') fechar(); if (ev.key === 'ArrowLeft' && imgs.length > 1) { idx = (idx - 1 + imgs.length) % imgs.length; mostrar(); } if (ev.key === 'ArrowRight' && imgs.length > 1) { idx = (idx + 1) % imgs.length; mostrar(); } };
    function fechar() { document.removeEventListener('keydown', tecla); el.remove(); if (anterior) anterior.focus(); }
    document.addEventListener('keydown', tecla);
    let x0 = null; el.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50 && imgs.length > 1) { idx = (idx + (dx < 0 ? 1 : -1) + imgs.length) % imgs.length; mostrar(); } x0 = null; });
    mostrar();
  }

  // ================= Simulador =================
  const RASCUNHO = 'portal:simulacao';
  const novoEstadoSim = () => ({

    cliente: { nome: '', telefone: '', email: '' },

    finDefinido: false, finValorDefinido: null, sujo: false, salvoEm: null

  const lerRascunho = () => { try { return JSON.parse(sessionStorage.getItem(RASCUNHO)); } catch { return null; } };

  async function telaSimulador(view) {

      S.valorOrigem = s.snapshot.origem_valor === 'tabela' ? 'tabela' : 'corretor-forcado';
      S.finDefinido = true; S.finValorDefinido = s.resultado.financiamento.valor;
      S.passo = Number(q.get('passo')) || 5; S.maxPasso = 6; S.salvoEm = s.atualizado_em; S.avisosAtuais = s.avisos_atuais; S.pdfs = s.pdfs;
      gravarRascunho(S);
      rotaAtual = '/simulador';
    } else if (q.get('emp') || q.get('un')) {

        S = novoEstadoSim();

    if (!S) S = novoEstadoSim();

    let emp = null;

    await carregarEmpSel();

    const aplicarUnidade = () => {

      if (u.tipologia_id) S.tip_id = u.tipologia_id;
      if (S.valorOrigem !== 'corretor-forcado') { S.entrada.valorImovel = u.preco; S.valorOrigem = 'tabela'; }

    };
    if (S.un_id) aplicarUnidade();
    const aplicarTip = () => {

      if (t && t.valor_referencia && !S.entrada.valorImovel && !S.un_id) S.entrada.valorImovel = t.valor_referencia;
    };
    aplicarTip();

    const paramSel = () => estado.params.find((p) => p.id === S.parametro_id) || null;
    // Faixa do MCMV pela avaliação da unidade (menor teto que cobre a avaliação).
    // Renda acima do limite dessa faixa (ou avaliação acima de todos os tetos): SBPE da Caixa.
    const ehMcmv = (x) => x && /^mcmv/.test(x.chave || '');
    function ajustarParam() {
      const sbpe = estado.params.find((x) => x.chave === 'sbpe-caixa');
      const renda = Number(S.entrada.renda) || 0, aval = Number(S.entrada.valorAvaliacao) || Number(S.entrada.valorImovel) || 0;
      S.paramAuto = null;
      const atual = paramSel();
      if (!(renda > 0) || !(aval > 0)) return;
      if (!S.parametroManual && !(ehMcmv(atual) || (sbpe && S.parametro_id === sbpe.id && S.parametroAuto))) return;
      const faixas = estado.params.filter((x) => ehMcmv(x) && x.dados.tetoImovel > 0).sort((a, b) => a.dados.tetoImovel - b.dados.tetoImovel);
      const faixa = faixas.find((x) => aval <= x.dados.tetoImovel) || null;
      const limite = faixa ? Number(faixa.dados.rendaMax) || 0 : 0;
      const alvo = faixa && renda <= limite ? faixa : sbpe;
      if (!alvo) return;
      const info = { renda, aval, limite, faixa: faixa ? faixa.nome : null, teto: faixa ? faixa.dados.tetoImovel : null, sbpe: alvo === sbpe, sugeridaId: alvo.id, sugeridaNome: alvo.nome };
      if (S.parametroManual) { S.paramAuto = { ...info, manual: true, difere: S.parametro_id !== alvo.id }; return; }
      if (S.parametro_id !== alvo.id) {
        S.parametro_id = alvo.id;
        if (S.finDefinido) { S.finDefinido = false; S.maxPasso = Math.min(S.maxPasso, 3); }
      }
      S.parametroAuto = true;
      S.paramAuto = { renda, aval, limite, faixa: faixa ? faixa.nome : null, teto: faixa ? faixa.dados.tetoImovel : null, sbpe: alvo === sbpe };
    }
    const regras = () => (emp ? emp.regras : {});
    const calcular = () => {
      ajustarParam();
      const p = paramSel();
      return Calc.simular(S.entrada, p ? { ...p.dados, nome: p.nome } : null, regras());
    };
    const mudou = (finAfeta) => {
      S.sujo = true;
      if (finAfeta && S.finDefinido) { S.finDefinido = false; S.maxPasso = Math.min(S.maxPasso, 3); }
      gravarRascunho(S);
    };

    const PASSOS = ['Empreendimento', 'Cliente', 'Financiamento', 'Entrada', 'Conferência', 'PDF'];
    const podeIr = (n) => {
      if (n <= 1) return true;
      if (n === 2) return S.entrada.valorImovel > 0;
      if (n === 3) return S.entrada.valorImovel > 0 && S.cliente.nome.trim().length >= 3 && S.entrada.renda > 0;
      if (n === 4) return S.finDefinido;
      if (n === 5) return S.finDefinido && S.entrada.nAnuais !== null && S.entrada.nAnuais !== undefined;
      if (n === 6) return !!S.codigo;
      return false;
    };

    function desenhar() {
      const r = calcular();
      view.innerHTML = `
        <div class="pagina-cab"><div><h1>Simulador de financiamento</h1>
          <p>${S.codigo ? `Editando <b>${esc(S.codigo)}</b>${S.salvoEm ? `, salva em ${dataHoraBR(S.salvoEm)}` : ''}${S.sujo ? ' (com alterações não salvas)' : ''}` : 'Rascunho salvo automaticamente neste navegador.'}</p></div>
          <div class="acoes"><button class="btn" id="nova">Nova simulação</button></div></div>
        ${S.avisosAtuais && S.avisosAtuais.length ? `<div class="alerta aviso" style="margin-bottom:16px">${IC.alerta}<div><b>Esta simulação foi feita com dados que mudaram:</b><ul>${S.avisosAtuais.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>Os valores salvos não foram alterados.</div></div>` : ''}
        <ol class="passos">${PASSOS.map((p, k) => { const n = k + 1; return `<li class="${n === S.passo ? 'atual' : n < S.passo || (n <= S.maxPasso && podeIr(n)) ? 'feito' : ''}"><button data-p="${n}" ${podeIr(n) && n <= Math.max(S.maxPasso, S.passo) ? '' : 'disabled'} ${n === S.passo ? 'aria-current="step"' : ''}><span class="barra"></span><span><span class="n">${n}.</span> ${p}</span></button></li>`; }).join('')}</ol>
        <div class="sim"><div id="etapa"></div><aside class="lado">${resumoLateral(r)}</aside></div>
        <div class="resumo-mob" id="resumo-mob"><span>Entrada <b>${R(r.valores.entrada)}</b></span><span>${r.status === 'conferida' ? '✔ Conferida' : 'Ajuste necessário'}</span><button id="ver-resumo">Ver resumo</button></div>`;
      $$('.passos [data-p]').forEach((b) => b.onclick = () => irPasso(Number(b.dataset.p)));
      $('#nova').onclick = async () => {
        if (S.sujo && !(await confirmar('Descartar alterações?', 'As alterações que não foram salvas serão perdidas.', 'Descartar', true))) return;
        S = novoEstadoSim(); emp = null; gravarRascunho(S); desenhar();
      };
      $('#ver-resumo').onclick = () => abrirDialogo(`${resumoLateral(calcular(), true)}<div class="acoes"><button class="btn" data-fechar>Fechar</button></div>`);
      const et = $('#etapa');
      [etapa1, etapa2, etapa3, etapa4, etapa5, etapa6][S.passo - 1](et);
    }

    function atualizarResumo() {
      const r = calcular();
      const lado = $('.sim .lado'); if (lado) lado.innerHTML = resumoLateral(r);
      const m = $('#resumo-mob'); if (m) m.firstElementChild.innerHTML = `Entrada <b>${R(r.valores.entrada)}</b>`;
      if (m) m.children[1].textContent = r.status === 'conferida' ? '✔ Conferida' : 'Ajuste necessário';
      return r;
    }

    function resumoLateral(r, emDialogo) {
      const v = r.valores, f = r.financiamento, en = r.entrada;
      return `<div class="resumo ${emDialogo ? '' : 'fixo'}"><h4>Resumo financeiro</h4>
        <div class="grande">${R(v.valorImovel || 0)}</div><div class="mpeq" style="color:#9C9C96;margin-bottom:10px">Valor do imóvel${S.valorOrigem === 'tabela' ? ' (tabela)' : ' (informado)'}</div>
        <dl>
          <div><dt>Avaliação</dt><dd>${v.valorAvaliacao ? R(v.valorAvaliacao) : '—'}</dd></div>
          <div><dt>Financiamento${S.finDefinido ? '' : ' (a definir)'}</dt><dd>${R(f.valor)}</dd></div>
          <div><dt>Percentual financiado</dt><dd>${pct(v.percentualFinanciado)}</dd></div>
          <div><dt>Total da entrada</dt><dd>${R(v.entrada)}</dd></div>
          <div><dt>Sinal</dt><dd>${R(v.sinal)}</dd></div>
          <div><dt>FGTS utilizado</dt><dd>${R(v.fgtsUsado)}</dd></div>
          ${v.subsidio ? `<div><dt>Subsídio</dt><dd>${R(v.subsidio)}</dd></div>` : ''}
          ${v.recursosProprios ? `<div><dt>Outros recursos</dt><dd>${R(v.recursosProprios)}</dd></div>` : ''}
          <div><dt>Mensais</dt><dd>${en.nMensais ? `${en.nMensais} × ${R(en.valorMensal)}` : '—'}</dd></div>
          <div><dt>Anuais</dt><dd>${en.nAnuais ? `${en.nAnuais} × ${R(en.valorAnual)}` : '—'}</dd></div>
          <div><dt>Prestação bancária est.</dt><dd>${f.prestacao ? R(f.prestacao) : '—'}</dd></div>
          <div><dt>Taxa de obras (média)</dt><dd>${Calc.taxaObraMedia(f) ? R(Calc.taxaObraMedia(f)) : '—'}</dd></div>
        </dl>
        ${S.passo >= 4 ? `<div class="status ${r.status === 'conferida' ? 'ok' : 'ajuste'}">${r.status === 'conferida' ? 'Composição financeira conferida' : `Ajuste necessário${Math.abs(en.diferenca) > 0.009 ? `: ${en.diferenca > 0 ? 'faltam' : 'excede em'} ${R(Math.abs(en.diferenca))}` : ''}`}</div>` : ''}
      </div>`;
    }

    function irPasso(n) {
      if (!podeIr(n)) { toast('Complete a etapa atual antes de avançar.', 'erro'); return; }
      S.passo = n; S.maxPasso = Math.max(S.maxPasso, n); gravarRascunho(S); transicao(() => desenhar()); window.scrollTo({ top: 0 });
    }

    // ----- campo de dinheiro -----
    const campoR = (id, rotulo, valor, { ajuda = '', origem = '', ro = false, obrig = false, slider = 0 } = {}) => `<div class="campo"><label for="${id}">${rotulo}${obrig ? ' *' : ''}${origem}</label>
      <div class="dinheiro"><input id="${id}" inputmode="decimal" autocomplete="off" value="${moedaTxt(valor)}" ${ro ? 'readonly' : ''} placeholder="0,00"></div>${slider ? `<input type="range" class="slider" id="${id}-r" min="0" max="${Math.ceil(slider / 500) * 500}" step="500" value="${Math.min(Number(valor) || 0, slider)}" aria-label="${rotulo}">` : ''}${ajuda ? `<span class="ajuda">${ajuda}</span>` : ''}<span class="erro-campo" id="${id}-erro"></span></div>`;
    const ligarR = (id, setter, aoMudar) => {
      const el = $(`#${id}`); if (!el || el.readOnly) return;
      el.addEventListener('input', () => { const v = lerMoeda(el.value); el.classList.toggle('invalido', Number.isNaN(v) || v < 0); if (!Number.isNaN(v)) { setter(v); aoMudar && aoMudar(); } });
      el.addEventListener('blur', () => { const v = lerMoeda(el.value); if (v !== null && !Number.isNaN(v)) el.value = moedaTxt(v); });
    };
    const O = { corretor: '<span class="origem corretor">Informado pelo corretor</span>', sistema: '<span class="origem sistema">Calculado pelo sistema</span>', banco: '<span class="origem banco">Depende de aprovação</span>', tabela: '<span class="origem tabela">Tabela de vendas</span>' };

    // ----- Etapa 1: empreendimento -----
    function etapa1(et) {
      const tips = emp ? emp.tipologias : [];
      const uns = emp ? emp.unidades || [] : [];
      const tab = emp ? emp.tabela_vigente : null;
      et.innerHTML = `<div class="etapa"><section class="painel"><h3>Empreendimento e valor do imóvel</h3>
        <div class="grade g2">
          <div class="campo"><label for="s-emp">Empreendimento</label><select id="s-emp"><option value="">Imóvel sem cadastro no portal</option>${estado.emps.map((x) => `<option value="${x.id}" ${x.id === S.emp_id ? 'selected' : ''}>${esc(x.nome)}${x.cidade ? ` — ${esc(x.cidade)}` : ''}</option>`).join('')}</select></div>
          <div class="campo"><label for="s-tip">Tipologia</label><select id="s-tip" ${tips.length ? '' : 'disabled'}><option value="">${tips.length ? 'Selecione' : 'Sem tipologias cadastradas'}</option>${tips.map((t) => `<option value="${t.id}" ${t.id === S.tip_id ? 'selected' : ''}>${esc(t.nome)} — ${m2(t.area)}</option>`).join('')}</select></div>
        </div>
        ${emp && uns.length ? `<div class="campo" style="margin-top:16px"><label for="s-un">Unidade (tabela ${esc(tab.versao)}, ${dataBR(tab.data_referencia)})</label>
          <select id="s-un"><option value="">Sem unidade definida</option>${uns.filter((u) => /dispon/i.test(u.disponibilidade || '') || u.id === S.un_id).map((u) => { const d = /dispon/i.test(u.disponibilidade || ''); return `<option value="${u.id}" ${u.id === S.un_id ? 'selected' : ''} ${d ? '' : 'disabled'}>${esc(rotUn(u.torre || '—', u.numero))} — ${u.preco ? R(u.preco) : 'sem preço'} (${esc(u.disponibilidade || 'situação não informada')})</option>`; }).join('')}</select>
          <span class="ajuda">A lista mostra só as unidades disponíveis na data da tabela.${tab.desatualizada ? ' Atenção: tabela desatualizada.' : ''}</span></div>`
          : emp ? `<div class="alerta info" style="margin-top:16px">${IC.info}<div>${tab ? 'A tabela vigente não tem unidades estruturadas.' : 'Este empreendimento não tem tabela de vendas cadastrada.'} Informe o valor do imóvel manualmente.</div></div>` : ''}
        <div class="grade g2" style="margin-top:16px">
          ${campoR('s-valor', 'Valor do imóvel', S.entrada.valorImovel, { obrig: true, origem: S.valorOrigem === 'tabela' ? O.tabela : O.corretor, ro: S.valorOrigem === 'tabela', ajuda: S.valorOrigem === 'tabela' ? '<button class="btn link peq" id="liberar" type="button" style="padding:0;min-height:0">Informar outro valor (negociação)</button>' : 'Valor de venda negociado com o cliente.' })}
          ${campoR('s-aval', 'Valor de avaliação', S.entrada.valorAvaliacao, { origem: O.banco, ajuda: 'O financiamento é calculado sobre a avaliação. Se ficar em branco, usa o valor do imóvel.' })}
        </div>
        ${emp && emp.status_comercial === 'Dados pendentes' ? `<div class="alerta aviso" style="margin-top:16px">${IC.alerta}<div>Este empreendimento ainda não tem dados oficiais cadastrados.</div></div>` : ''}
      </section>
      <div class="navegar"><span></span><button class="btn prim" id="av">Continuar para o cliente${IC.prox}</button></div></div>`;
      $('#s-emp').onchange = async (ev) => { S.emp_id = Number(ev.target.value) || null; S.tip_id = null; S.un_id = null; S.parametro_id = null; S.parametroManual = false; S.valorOrigem = 'corretor'; S.entrada.valorAvaliacao = null; await carregarEmpSel(); mudou(true); desenhar(); };
      $('#s-tip').onchange = (ev) => { S.tip_id = Number(ev.target.value) || null; const t = tips.find((x) => x.id === S.tip_id); if (t && t.valor_avaliacao) S.entrada.valorAvaliacao = t.valor_avaliacao; aplicarTip(); mudou(true); desenhar(); };
      const su = $('#s-un'); if (su) su.onchange = (ev) => { S.un_id = Number(ev.target.value) || null; if (S.un_id) { S.valorOrigem = 'tabela'; aplicarUnidade(); } else S.valorOrigem = 'corretor'; mudou(true); desenhar(); };
      const lib = $('#liberar'); if (lib) lib.onclick = () => { S.valorOrigem = 'corretor-forcado'; mudou(true); desenhar(); setTimeout(() => $('#s-valor').focus()); };
      ligarR('s-valor', (v) => { S.entrada.valorImovel = v; }, () => { mudou(true); atualizarResumo(); });
      ligarR('s-aval', (v) => { S.entrada.valorAvaliacao = v; }, () => { mudou(true); atualizarResumo(); });
      $('#av').onclick = () => { if (!(S.entrada.valorImovel > 0)) { $('#s-valor-erro').textContent = 'Informe o valor do imóvel.'; $('#s-valor').classList.add('invalido'); $('#s-valor').focus(); return; } irPasso(2); };
    }

    // ----- Etapa 2: cliente -----
    function etapa2(et) {
      const c = S.cliente, e2 = S.entrada;
      et.innerHTML = `<div class="etapa"><section class="painel"><h3>Identificação do cliente</h3>
        <div class="grade g3">
          <div class="campo" style="grid-column:span 1"><label for="c-nome">Nome completo *</label><input id="c-nome" type="text" autocomplete="off" value="${esc(c.nome)}" maxlength="160"><span class="erro-campo" id="c-nome-erro"></span></div>
          <div class="campo"><label for="c-tel">Telefone (opcional)</label><input id="c-tel" type="tel" inputmode="tel" value="${esc(c.telefone || '')}" maxlength="30"></div>
          <div class="campo"><label for="c-email">E-mail (opcional)</label><input id="c-email" type="email" value="${esc(c.email || '')}" maxlength="160"><span class="erro-campo" id="c-email-erro"></span></div>
        </div>
        <p class="mpeq sec" style="margin-top:8px">O nome aparece no PDF. Não peça CPF ou outros documentos aqui.</p></section>
        <section class="painel"><h3>Renda e recursos</h3>
        <div class="grade g2">
          ${campoR('c-renda', 'Renda familiar mensal bruta', e2.renda, { obrig: true, origem: O.corretor })}
          <div class="campo"><label for="c-idade">Idade do proponente mais velho (opcional)</label><input id="c-idade" type="number" min="18" max="80" inputmode="numeric" value="${e2.idade ?? ''}"><span class="ajuda">Usada só para limitar o prazo (idade + prazo até 80 anos e 6 meses).</span></div>
          ${campoR('c-fgts', 'Saldo disponível de FGTS', e2.fgtsSaldo, { origem: O.corretor, ajuda: 'Saldo informado. Quanto será usado é definido na etapa da entrada.' })}
          ${campoR('c-sinal', 'Valor disponível para o sinal', e2.sinalDisponivel, { origem: O.corretor })}
        </div></section>
        <div class="navegar"><button class="btn" id="vol">${IC.voltar}Voltar</button><button class="btn prim" id="av">Continuar para o financiamento${IC.prox}</button></div></div>`;
      $('#c-nome').oninput = (ev) => { S.cliente.nome = ev.target.value; mudou(); };
      $('#c-tel').oninput = (ev) => { S.cliente.telefone = ev.target.value; mudou(); };
      $('#c-email').oninput = (ev) => { S.cliente.email = ev.target.value; mudou(); };
      $('#c-idade').oninput = (ev) => { S.entrada.idade = ev.target.value ? Number(ev.target.value) : null; mudou(true); atualizarResumo(); };
      ligarR('c-renda', (v) => { S.entrada.renda = v; }, () => { mudou(true); atualizarResumo(); });
      ligarR('c-fgts', (v) => { S.entrada.fgtsSaldo = v; }, () => { mudou(); atualizarResumo(); });
      ligarR('c-sinal', (v) => { S.entrada.sinalDisponivel = v; if (S.entrada.sinal === null) S.entrada.sinal = v; }, () => { mudou(); atualizarResumo(); });
      $('#vol').onclick = () => irPasso(1);
      $('#av').onclick = () => {
        let ok = true;
        if (S.cliente.nome.trim().length < 3) { $('#c-nome-erro').textContent = 'Informe o nome completo do cliente.'; $('#c-nome').classList.add('invalido'); ok = false; }
        if (S.cliente.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.cliente.email)) { $('#c-email-erro').textContent = 'E-mail inválido.'; ok = false; }
        if (!(S.entrada.renda > 0)) { $('#c-renda-erro').textContent = 'Informe a renda familiar.'; $('#c-renda').classList.add('invalido'); ok = false; }
        if (ok) irPasso(3); else toast('Corrija os campos destacados.', 'erro');
      };
    }

    // ----- Etapa 3: financiamento -----
    function etapa3(et) {
      const r = calcular(); const f = r.financiamento; const p = paramSel();
      et.innerHTML = `<div class="etapa">${S.paramAuto && S.paramAuto.manual && S.paramAuto.difere ? `<div class="alerta aviso" style="margin-bottom:16px">${IC.alerta}<div><b>Regra escolhida por você.</b> Pela avaliação de ${R(S.paramAuto.aval)} e renda de ${R(S.paramAuto.renda)}, a regra sugerida é <b>${esc(S.paramAuto.sugeridaNome)}</b>. <button class="btn peq" id="usar-sug" style="margin-left:6px">Usar a sugerida</button></div></div>` : S.paramAuto ? (S.paramAuto.sbpe ? `<div class="alerta aviso" style="margin-bottom:16px">${IC.alerta}<div><b>Financiamento pelo SBPE da Caixa.</b> ${S.paramAuto.faixa ? `Pela avaliação de ${R(S.paramAuto.aval)}, a unidade se enquadra no ${esc(S.paramAuto.faixa)}, com renda até ${R(S.paramAuto.limite)}. A renda de ${R(S.paramAuto.renda)} passa desse limite.` : `A avaliação da unidade (${R(S.paramAuto.aval)}) passa do teto do Minha Casa Minha Vida.`} A simulação usa a taxa do SBPE.</div></div>` : `<div class="alerta info" style="margin-bottom:16px">${IC.ok}<div>Pela avaliação de ${R(S.paramAuto.aval)}, a unidade se enquadra no <b>${esc(S.paramAuto.faixa)}</b> (imóvel até ${R(S.paramAuto.teto)}, renda até ${R(S.paramAuto.limite)}).</div></div>`) : ''}<section class="painel"><h3>Parâmetros do financiamento</h3>
        <div class="grade g2">
          <div class="campo"><label for="f-param">Regra de financiamento</label><select id="f-param"><option value="">Sem parâmetro (informar financiamento)</option>${estado.params.map((x) => `<option value="${x.id}" ${x.id === S.parametro_id ? 'selected' : ''}>${esc(x.nome)} — ${esc(x.versao)}${x.exemplo ? ' (exemplo)' : ''}</option>`).join('')}</select>
            <span class="ajuda">${S.paramAuto && !S.paramAuto.manual ? 'Escolhida automaticamente pela avaliação e pela renda. Você pode trocar.' : S.parametroManual ? 'Escolhida por você.' : emp && emp.parametro ? `Padrão do empreendimento: ${esc(emp.parametro.nome)}. Você pode trocar.` : 'Escolha a regra de financiamento.'}</span></div>
          <div class="campo"><span class="rot">Como definir o valor</span><div class="seg" role="group"><button type="button" data-modo="calculado" aria-pressed="${S.entrada.financiamentoModo !== 'informado'}">Calcular pelos parâmetros</button><button type="button" data-modo="informado" aria-pressed="${S.entrada.financiamentoModo === 'informado'}">Informar valor aprovado / estimado</button></div></div>
        </div>
        ${p ? `<div class="calc-box" style="margin-top:16px">
            <div><span>Taxa nominal</span><b>${String(p.dados.taxaAnual).replace('.', ',')}% a.a.</b></div>
            <div><span>Prazo máximo</span><b>${p.dados.prazoMaxMeses} meses</b></div>
            <div><span>Comprometimento máx.</span><b>${pct(p.dados.comprometimentoMax, 0)} da renda</b></div>
            <div><span>Cota máxima</span><b>${p.dados.cotaMax ? pct(p.dados.cotaMax, 0) + ' da avaliação' : '—'}</b></div>
            ${p.dados.rendaMax ? `<div><span>Renda da faixa</span><b>até ${R(p.dados.rendaMax)}</b></div>` : ''}</div>
          <p class="mpeq sec" style="margin-top:8px">Fonte: ${esc(p.fonte || 'não informada')} Vigência desde ${dataBR(p.vigencia_inicio)}.${p.exemplo ? ' <b>Valores de exemplo, não oficiais.</b>' : ''}</p>`
          : `<div class="alerta aviso" style="margin-top:16px">${IC.alerta}<div>Sem parâmetros oficiais selecionados: o sistema não calcula financiamento nem prestação. Informe o valor do financiamento (por exemplo, o aprovado pelo banco).</div></div>`}
        ${S.entrada.financiamentoModo === 'informado' ? `<div class="grade g2" style="margin-top:16px">${campoR('f-inf', 'Valor do financiamento', S.entrada.financiamentoInformado, { obrig: true, origem: O.corretor + O.banco })}</div>` : ''}
      </section>

          <div><span>Prazo usado</span><b>${f.prazo} meses</b></div></div>` : ''}
        <div class="def-fin"><div><span class="peq sec">Financiamento ${S.entrada.financiamentoModo === 'informado' ? 'informado' : 'calculado'} ${O.banco}</span><div class="v" id="v-fin">${R(f.valor)}</div>
          <span class="peq">${f.prestacao ? `Prestação estimada (Price, sem seguros): <b class="valor">${R(f.prestacao)}</b>, ${pct(f.comprometimentoPrestacao)} da renda` : 'Prestação não calculada: faltam taxa e prazo.'}</span>${Calc.taxaObraMedia(f) ? `<span class="peq" style="display:block;margin-top:4px">Taxa de obras, média estimada durante a construção: <b class="valor">${R(Calc.taxaObraMedia(f))}</b> por mês</span>` : ''}</div>
          <div class="acoes">${S.finDefinido && S.finValorDefinido === f.valor ? `<span class="chip verde">${IC.ok}Financiamento definido</span>` : `<button class="btn prim" id="definir">Definir este financiamento</button>`}</div></div>
        <div class="lista-alertas" style="margin-top:14px">${[...r.erros.filter((x) => ['parametro', 'financiamentoInformado', 'prazoMeses'].includes(x.campo)).map((x) => `<div class="alerta erro">${IC.alerta}<div>${esc(x.msg)}</div></div>`), ...r.avisos.filter((x) => ['financiamentoInformado', 'renda', 'valorImovel', 'valorAvaliacao'].includes(x.campo)).map((x) => `<div class="alerta aviso">${IC.info}<div>${esc(x.msg)}</div></div>`)].join('')}</div>
        ${f.temParametros ? `<details style="margin-top:12px"><summary class="peq">Premissas do cálculo</summary><ul class="peq sec">${r.premissas.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}

      <div class="navegar"><button class="btn" id="vol">${IC.voltar}Voltar</button><button class="btn prim" id="av" ${S.finDefinido ? '' : 'disabled'}>Continuar para a entrada${IC.prox}</button></div></div>`;
      { const us = $('#usar-sug'); if (us) us.onclick = () => { S.parametroManual = false; mudou(true); desenhar(); }; }
      $('#f-param').onchange = (ev) => { S.parametro_id = Number(ev.target.value) || null; S.parametroManual = true; S.parametroAuto = false; if (!S.parametro_id) S.entrada.financiamentoModo = 'informado'; mudou(true); desenhar(); };
      $$('[data-modo]').forEach((b) => b.onclick = () => { S.entrada.financiamentoModo = b.dataset.modo; mudou(true); desenhar(); });
      ligarR('f-inf', (v) => { S.entrada.financiamentoInformado = v; }, () => { mudou(true); const r2 = atualizarResumo(); $('#v-fin').textContent = R(r2.financiamento.valor); const d = $('#definir'); if (!d) desenhar(); });
      const d = $('#definir');
      if (d) d.onclick = () => {
        const r2 = calcular();
        const bloq = r2.erros.filter((x) => ['parametro', 'financiamentoInformado', 'prazoMeses', 'valorImovel', 'renda'].includes(x.campo));
        if (bloq.length || !(r2.financiamento.valor > 0)) { toast(bloq.length ? bloq[0].msg : 'O financiamento precisa ser maior que zero.', 'erro'); return; }
        S.finDefinido = true; S.finValorDefinido = r2.financiamento.valor;
        if (S.entrada.fgtsUsado === null) S.entrada.fgtsUsado = 0;
        if (S.entrada.sinal === null) S.entrada.sinal = S.entrada.sinalDisponivel || 0;

      $('#av').onclick = () => irPasso(4);

    // ----- Etapa 4: entrada -----
    const CORES = { subsidio: 'var(--cor-subsidio)', recursos: 'var(--cor-recursos)', sinal: 'var(--cor-sinal)', fgts: 'var(--cor-fgts)', mensais: 'var(--cor-mensais)', anuais: 'var(--cor-anuais)' };
    function composicaoHTML(r) {
      const en = r.entrada, tot = Math.max(r.valores.entrada, en.soma, 1);

          ${r.componentes.map((c) => `<i data-t="${c.tipo}" style="flex-basis:${(c.total / tot) * 100}%;background:${CORES[c.tipo]}" title="${esc(c.rotulo)}: ${R(c.total)}"></i>`).join('')}

    function etapa4(et) {

          <div class="acoes"><div class="contador"><button type="button" id="a-menos" aria-label="Menos uma anual">−</button><output id="a-n">${e4.nAnuais === null ? '?' : e4.nAnuais}</output><button type="button" id="a-mais" aria-label="Mais uma anual">+</button></div>
            ${e4.nAnuais === null ? `<button class="btn" id="a-sug" type="button">Usar a sugestão (${en.anuaisSugeridas})</button>` : ''}</div>
          ${e4.nAnuais > 0 ? `<div class="grade g2"><div class="campo"><span class="rot">Valor de cada anual</span><div class="seg" role="group"><button type="button" data-am="auto" aria-pressed="${e4.anualModo !== 'informado'}">Calcular (máximo permitido)</button><button type="button" data-am="informado" aria-pressed="${e4.anualModo === 'informado'}">Informar valor</button></div></div>
            ${e4.anualModo === 'informado' ? campoR('e-anual', 'Valor de cada parcela anual', e4.anualValor, { origem: O.corretor }) : `<div class="campo"><span class="rot">Valor calculado ${O.sistema}</span><b class="valor" style="font-size:1.2rem" id="v-anual">${R(en.valorAnual)}</b><span class="ajuda">${pct(r.indicadores.anualSobreRenda)} da renda mensal</span></div>`}</div>` : ''}

        <section class="painel"><h3>Parcelas mensais da entrada</h3>
          <div class="grade g2"><div class="campo"><label for="e-nm">Quantidade de parcelas mensais</label><input id="e-nm" type="number" min="0" max="${maxM}" inputmode="numeric" value="${e4.nMensais ?? ''}" placeholder="0"><input type="range" class="slider" id="e-nm-r" min="0" max="${maxM}" step="1" value="${e4.nMensais ?? 0}" aria-label="Parcelas mensais">
            <span class="ajuda">${rg.maxMensais ? `Máximo neste empreendimento: ${rg.maxMensais}.` : 'Sem limite cadastrado para este empreendimento.'}</span></div>
            <div class="campo"><span class="rot">Valor mensal ${O.sistema}</span><b class="valor" style="font-size:1.2rem" id="v-mensal">${en.nMensais ? R(en.valorMensal) : '—'}</b><span class="ajuda" id="v-mensal-aj">${en.nMensais ? `${pct(r.indicadores.comprometimentoMensalEntrada)} da renda${en.ajusteCentavos ? `; última parcela com ajuste de ${R(en.ajusteCentavos)}` : ''}` : 'Calculado a partir do saldo restante.'}</span></div></div>
        </section>
        <section class="painel" id="comp-painel"><h3>Composição da entrada</h3><div id="comp">${composicaoHTML(r)}</div>
          <div class="lista-alertas" id="alertas4" style="margin-top:14px"></div></section>
        <div class="navegar"><button class="btn" id="vol">${IC.voltar}Voltar</button><button class="btn prim" id="av">Conferir${IC.prox}</button></div></div>`;

      const refrescar = () => {
        const r2 = atualizarResumo(); $('#comp').innerHTML = composicaoHTML(r2);
        const va = $('#v-anual'); if (va) va.textContent = R(r2.entrada.valorAnual);
        $('#v-mensal').textContent = r2.entrada.nMensais ? R(r2.entrada.valorMensal) : '—';
        $('#v-mensal-aj').textContent = r2.entrada.nMensais ? `${pct(r2.indicadores.comprometimentoMensalEntrada)} da renda${r2.entrada.ajusteCentavos ? `; última parcela com ajuste de ${R(r2.entrada.ajusteCentavos)}` : ''}` : 'Calculado a partir do saldo restante.';
        const campos = ['sinal', 'fgtsUsado', 'anualValor', 'nAnuais', 'nMensais', 'composicao'];
        $('#alertas4').innerHTML = [...r2.erros.filter((x) => campos.includes(x.campo)).map((x) => `<div class="alerta erro">${IC.alerta}<div>${esc(x.msg)}</div></div>`),

      };
      ligarR('e-sinal', (v) => { S.entrada.sinal = v; }, () => { mudou(); refrescar(); });
      ligarR('e-fgts', (v) => { S.entrada.fgtsUsado = v; }, () => { mudou(); refrescar(); });
      ligarR('e-sub', (v) => { S.entrada.subsidio = v; }, () => { mudou(); refrescar(); });
      ligarR('e-rec', (v) => { S.entrada.recursosProprios = v; }, () => { mudou(); refrescar(); });

      const uf = $('#usar-fgts'); if (uf) uf.onclick = () => { S.entrada.fgtsUsado = S.entrada.fgtsSaldo; mudou(); desenhar(); };

      $('#e-nm').oninput = (ev) => { const n = parseInt(ev.target.value, 10); S.entrada.nMensais = Number.isFinite(n) ? Math.max(0, n) : null; const rr = $('#e-nm-r'); if (rr && Number.isFinite(n)) { rr.value = n; rr.dispatchEvent(new Event('input')); } mudou(); refrescar(); };

        $('#e-sinal').addEventListener('input', () => { const v = lerMoeda($('#e-sinal').value); if (v >= 0) { sr.value = v; sr.dispatchEvent(new Event('input')); } }); }
      $('#vol').onclick = () => irPasso(3);

      refrescar();
    }

    // ----- Etapa 5: conferência e salvamento -----
    function etapa5(et) {
      const r = calcular(); const v = r.valores, f = r.financiamento, en = r.entrada;
      const t = emp && S.tip_id ? emp.tipologias.find((x) => x.id === S.tip_id) : null;
      const u = emp && S.un_id ? emp.unidades.find((x) => x.id === S.un_id) : null;
      et.innerHTML = `<div class="etapa">
        <section class="painel"><div class="cab"><h3>Conferência</h3>${r.status === 'conferida' ? `<span class="chip verde">${IC.ok}Composição financeira conferida</span>` : '<span class="chip vinho">Ajuste necessário</span>'}</div>
          <dl class="ficha">
            <div><dt>Cliente</dt><dd>${esc(S.cliente.nome)}</dd></div>

            <div><dt>Valor do imóvel</dt><dd class="valor">${R(v.valorImovel)} <span class="origem ${S.valorOrigem === 'tabela' ? 'tabela' : 'corretor'}">${S.valorOrigem === 'tabela' ? 'Tabela' : 'Informado'}</span></dd></div>

            <div><dt>FGTS utilizado</dt><dd class="valor">${R(v.fgtsUsado)} de ${R(v.fgtsSaldo)}</dd></div>

            <div><dt>Recursos próprios</dt><dd class="valor">${R(v.recursosPropriosTotal)}</dd></div>
            <div><dt>Total da entrada</dt><dd class="valor">${R(v.entrada)} (${pct(v.percentualEntrada)})</dd></div>
            <div><dt>Saldo a parcelar após sinal e FGTS</dt><dd class="valor">${R(Math.max(0, v.saldoAposSinalFgts))}</dd></div>
            <div><dt>Prestação bancária estimada</dt><dd class="valor">${f.prestacao ? `${R(f.prestacao)} (${f.prazo}x)` : 'Não calculada'}</dd></div>
            <div><dt>Taxa de obras (média mensal estimada)</dt><dd class="valor">${Calc.taxaObraMedia(f) ? R(Calc.taxaObraMedia(f)) : '—'}</dd></div>
          </dl></section>
        <section class="painel"><h3>Parcelamento da entrada</h3>
          <div class="rolagem"><table class="tab resp"><thead><tr><th>Componente</th><th class="dir">Quantidade</th><th class="dir">Valor unitário</th><th class="dir">Valor total</th></tr></thead><tbody>
            ${r.componentes.map((c) => `<tr><td data-r="Componente"><b>${esc(c.rotulo)}</b></td><td data-r="Quantidade" class="dir">${c.quantidade ?? '—'}</td><td data-r="Valor unitário" class="dir valor">${c.unitario ? R(c.unitario) : '—'}</td><td data-r="Valor total" class="dir valor">${R(c.total)}</td></tr>`).join('')}
            <tr><td data-r=""><b>Total</b></td><td></td><td></td><td data-r="Total" class="dir valor"><b>${R(en.soma)}</b></td></tr></tbody></table></div>
          <div style="margin-top:16px">${composicaoHTML(r)}</div></section>
        <section class="painel"><h3>Capacidade de pagamento</h3>
          <div class="indicadores">
            <div><span>Parcela mensal da entrada</span><b>${en.nMensais ? R(en.valorMensal) : '—'}</b><small>${pct(r.indicadores.comprometimentoMensalEntrada)} da renda</small></div>
            <div><span>Cada parcela anual</span><b>${en.nAnuais ? R(en.valorAnual) : '—'}</b><small>${en.nAnuais ? `${pct(r.indicadores.anualSobreRenda)} da renda (limite ${pct(r.regras.limiteAnualPctRenda, 0)})` : 'Sem anuais'}</small></div>
            <div><span>Prestação do financiamento</span><b>${f.prestacao ? R(f.prestacao) : '—'}</b><small>${f.prestacao ? `${pct(f.comprometimentoPrestacao)} da renda, paga ao banco` : 'Sem parâmetros'}</small></div>

            <div><span>Saldo após sinal e FGTS</span><b>${R(Math.max(0, v.saldoAposSinalFgts))}</b></div>

          </div>
          <p class="mpeq sec" style="margin-top:10px">A parcela mensal da entrada (paga à incorporadora) e a prestação do financiamento (paga ao banco) são valores diferentes e não estão somados.</p></section>
        ${r.erros.length || r.avisos.length ? `<section class="painel"><h3>Pontos de atenção</h3><div class="lista-alertas">${r.erros.map((x) => `<div class="alerta erro">${IC.alerta}<div>${esc(x.msg)}</div></div>`).join('')}${r.avisos.map((x) => `<div class="alerta aviso">${IC.info}<div>${esc(x.msg)}</div></div>`).join('')}</div></section>` : ''}
        <div class="navegar"><button class="btn" id="vol">${IC.voltar}Voltar</button><button class="btn prim" id="salvar">${S.codigo ? 'Salvar alterações' : 'Salvar simulação'}</button></div></div>`;
      $('#vol').onclick = () => irPasso(4);

  // ================= Comparador de empreendimentos =================
  const comparar = new Set();
  const barraCmp = document.createElement('div');
  barraCmp.id = 'cmp-barra'; barraCmp.setAttribute('role', 'region'); barraCmp.setAttribute('aria-label', 'Comparação');
  document.body.appendChild(barraCmp);
  function atualizarBarraCmp() {
    const n = comparar.size;
    barraCmp.innerHTML = `<span><b>${n}</b> selecionado${n === 1 ? '' : 's'} para comparar</span><button class="btn peq" id="cmp-limpar">Limpar</button><button class="btn peq prim" id="cmp-abrir" ${n < 2 ? 'disabled' : ''}>Comparar</button>`;
    barraCmp.classList.toggle('on', n > 0 && /^\/?(empreendimentos)?(\?.*)?$/.test(rotaAtual));
    $('#cmp-limpar').onclick = () => { comparar.clear(); $$('.cmp').forEach((b) => b.setAttribute('aria-pressed', 'false')); atualizarBarraCmp(); };
    $('#cmp-abrir').onclick = abrirComparacao;
    $$('.cmp').forEach((b) => b.setAttribute('aria-pressed', comparar.has(Number(b.dataset.cmp))));
  }
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('.cmp'); if (!b) return;
    ev.preventDefault(); ev.stopPropagation();
    const id = Number(b.dataset.cmp);
    if (comparar.has(id)) comparar.delete(id);
    else { if (comparar.size >= 3) { toast('Compare até 3 empreendimentos por vez.', 'erro'); return; } comparar.add(id); }
    atualizarBarraCmp();
  });
  function abrirComparacao() {
    const es = [...comparar].map((id) => DATA.emps.find((x) => x.id === id)).filter(Boolean);
    const linhas = [
      ['Preço', (e) => faixaPreco(e).v, (e) => e.preco_min || e.avaliacao_min, 'min'],
      ['Área', (e) => (e.area_min ? intervalo(e.area_min, e.area_max, m2) : '—'), (e) => e.area_max, 'max'],
      ['Dormitórios', (e) => intervalo(e.dorm_min, e.dorm_max) ?? '—', (e) => e.dorm_max, 'max'],
      ['Suítes', (e) => (e.suites_max ? `até ${e.suites_max}` : e.suites_max === 0 ? 'sem suíte' : '—'), (e) => e.suites_max, 'max'],
      ['Vagas', (e) => (e.vagas_max ?? '—'), (e) => e.vagas_max, 'max'],
      ['Entrega', (e) => e.previsao_entrega || '—'],
      ['Programa', (e) => e.programa || '—'],
      ['Local', (e) => [e.bairro, e.cidade].filter(Boolean).join(', ') || '—'],
      ['Unidades disponíveis', (e) => (e.unidades.length ? String(e.unidades.filter((u) => /dispon/i.test(u.disponibilidade || '')).length) : 'sem tabela'), (e) => e.unidades.filter((u) => /dispon/i.test(u.disponibilidade || '')).length, 'max'],
      ['Itens de lazer', (e) => String((e.ficha.lazer || []).length || '—'), (e) => (e.ficha.lazer || []).length, 'max'],
      ['Mensais da entrada', (e) => (e.regras.maxMensais ? `até ${e.regras.maxMensais}` : '—'), (e) => e.regras.maxMensais, 'max'],
      ['Parcelas anuais', (e) => { const r = Calc.mesclarRegras(e.regras); return r.anuaisSugeridas === 0 && !r.maxAnuais ? 'não previstas' : `${r.maxAnuais ? 'até ' + r.maxAnuais + ', ' : ''}até ${pct(r.limiteAnualPctRenda, 0)} da renda`; }]
    ];
    const melhor = (f, modo) => { if (!f) return null; const v = es.map(f).filter((x) => x !== null && x !== undefined && x !== 0); if (v.length < 2) return null; return modo === 'min' ? Math.min(...v) : Math.max(...v); };
    abrirDialogo(`<div class="cab"><h3>Comparação</h3><button class="btn peq" data-fechar>Fechar</button></div>
      <div class="rolagem"><table class="cmp-tab" style="width:100%;border-collapse:collapse"><thead><tr><th></th>${es.map((e) => `<th>${esc(e.nome)}</th>`).join('')}</tr></thead><tbody>
      ${linhas.map(([rot, f, val, modo]) => { const m = melhor(val, modo); return `<tr><th>${rot}</th>${es.map((e) => `<td class="${m !== null && val(e) === m ? 'melhor' : ''}"><b>${esc(f(e))}</b></td>`).join('')}</tr>`; }).join('')}
      <tr><th></th>${es.map((e) => `<td><div class="acoes"><a class="btn peq" href="#/e/${esc(e.slug)}" data-fechar>Ver</a><a class="btn peq prim" href="#/simulador?emp=${e.id}" data-fechar>Simular</a></div></td>`).join('')}</tr>
      </tbody></table></div><p class="mpeq sec">Em verde, o melhor valor de cada linha entre os escolhidos.</p>`);
    dlg.style.maxWidth = '980px';
  }

        ${DATA.params.map((p) => `<div style="padding:14px 0;border-bottom:1px solid var(--linha-suave)"><b>${esc(p.nome)}</b> <span class="sec peq">versão ${esc(p.versao)}, vigência desde ${dataBR(p.vigencia_inicio)}</span>
          <div class="calc-box" style="margin-top:10px"><div><span>Taxa nominal</span><b>${String(p.dados.taxaAnual).replace('.', ',')}% a.a.</b></div><div><span>Prazo máximo</span><b>${p.dados.prazoMaxMeses} meses</b></div>
          <div><span>Comprometimento</span><b>${pct(p.dados.comprometimentoMax, 0)} da renda</b></div><div><span>Cota</span><b>${pct(p.dados.cotaMax, 0)} da avaliação</b></div>
          <div><span>Renda da faixa</span><b>${R(p.dados.rendaMin)} a ${R(p.dados.rendaMax)}</b></div><div><span>Teto do imóvel</span><b>${R(p.dados.tetoImovel)}</b></div></div>
          <p class="mpeq sec" style="margin-top:8px">Fonte: ${esc(p.fonte)}</p></div>`).join('')}
        <h4 style="margin:18px 0 8px">Regras de cálculo</h4>
        <ul class="peq" style="margin:0;padding-left:18px;display:grid;gap:4px">
          <li>Prestação pela Tabela Price, com taxa nominal dividida por 12. Não inclui seguros nem taxa de administração.</li>
          <li>Financiamento sobre o valor de avaliação, limitado pela renda e pela cota.</li>
          <li>Entrada = valor de venda − financiamento.</li>
          <li>Cada parcela anual de até 80% da renda familiar mensal, salvo condição própria do empreendimento.</li>
          <li>Sugestão de 3 anuais; nenhuma se o sinal passar de 70% da entrada.</li>
        </ul>
        <p class="mpeq sec" style="margin-top:12px">Cadastro atualizado em ${dataHoraBR(DATA.gerado_em)}. Para mudar preços, tabelas ou empreendimentos, peça a atualização ao responsável pelo portal.</p></section>`;
    $('#f-cor').onsubmit = (ev) => {
      ev.preventDefault();
      const ok = LS.set('portal:corretor', { nome: $('#c-n').value.trim(), creci: $('#c-cr').value.trim(), telefone: $('#c-t').value.trim() });
      const rn = $('#rod-nome'); if (rn) rn.textContent = $('#c-n').value.trim() || 'Corretor';
      toast(ok ? 'Dados salvos neste aparelho.' : 'Este navegador não permite guardar dados.', ok ? '' : 'erro');
    };
    $('#bk-baixar').onclick = () => {
      const l = simsTodas();
      if (!l.length) { toast('Ainda não há simulações salvas.', 'erro'); return; }
      salvarBlob(new Blob([JSON.stringify({ tipo: 'simulacoes-portal', exportado_em: new Date().toISOString(), simulacoes: l }, null, 1)], { type: 'application/json' }), `simulacoes-${new Date().toISOString().slice(0, 10)}.json`);
    };
    $('#bk-arq').onchange = async (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      try {
        const d = JSON.parse(await f.text());
        if (!d || !Array.isArray(d.simulacoes)) throw new Error();
        const atuais = simsTodas(); const cods = new Set(atuais.map((s) => s.codigo));
        const novas = d.simulacoes.filter((s) => s && s.codigo && s.cliente && s.resultado && s.snapshot && !cods.has(s.codigo));
        gravarSims([...novas, ...atuais]);
        toast(`${novas.length} simulação(ões) importada(s).`);
      } catch { toast('Arquivo inválido: use uma cópia baixada por este portal.', 'erro'); }
      ev.target.value = '';
    };
  }

  rotear();
})();

</script>
</body></html>
