<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style></head><body><title>Portal de Empreendimentos</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>

:root {
  --vinho: #AF2846;
  --vinho-escuro: #8E1F38;
  --vinho-claro: #F6E3E8;
  --cinza: #74746E;
  --claro: #EEEEEE;
  --preto: #0C0C0C;
  --branco: #FFFFFF;
  --linha: #DCDCD8;
  --fundo: #F5F5F3;
  --sup: #FFFFFF;
  --texto: #0C0C0C;
  --tinta: #0C0C0C;
  --sobre-tinta: #FFFFFF;
  --linha-suave: #ECECE9;
  --hover: #FAFAF9;
  --topo: rgba(245,245,243,.94);
  --esq1: #ECECEA;
  --esq2: #F6F6F4;
  --vinho-claro2: #F9EEF1;
  --ambar-texto: #6B4A00;
  --sombra: rgba(0,0,0,.12);
  --verde: #2E7D4F;
  --verde-claro: #E3F1E8;
  --ambar: #9A6A00;
  --ambar-claro: #FBF1DA;
  --cor-sinal: #AF2846;
  --cor-fgts: #0C0C0C;
  --cor-mensais: #74746E;
  --cor-anuais: #C9798C;
  --cor-subsidio: #B9B9B2;
  --cor-recursos: #4A4A46;
  --raio: 10px;
  --raio-p: 7px;
  --lateral: 248px;
  --t-xs: 0.75rem; --t-s: 0.875rem; --t-m: 1rem; --t-l: 1.25rem; --t-xl: 1.625rem; --t-xxl: 2.125rem;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body { margin: 0; font-family: 'Montserrat', system-ui, sans-serif; font-size: var(--t-m); line-height: 1.5; color: var(--texto); background: var(--fundo); }
img { max-width: 100%; display: block; }
a { color: var(--vinho); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font-size: var(--t-xxl); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: var(--t-xl); font-weight: 700; letter-spacing: -0.015em; }
h3 { font-size: var(--t-l); font-weight: 600; }
h4 { font-size: var(--t-m); font-weight: 600; }
p { margin: 0; }
.num, .valor { font-variant-numeric: tabular-nums; }
.valor { font-weight: 600; }
.sec { color: var(--cinza); }
.peq { font-size: var(--t-s); }
.mpeq { font-size: var(--t-xs); }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--vinho); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------- Estrutura ---------- */
.shell { min-height: 100vh; }
.lateral { position: fixed; inset: 0 auto 0 0; width: var(--lateral); background: var(--preto); color: #D8D8D3; display: flex; flex-direction: column; padding: 22px 14px; z-index: 20; }
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 10px 26px; color: var(--branco); text-decoration: none; }
.marca svg { width: 30px; height: 30px; flex: none; }
.marca b { display: block; font-size: 0.95rem; letter-spacing: -0.01em; line-height: 1.15; }
.marca span { display: block; font-size: var(--t-xs); color: #9C9C96; font-weight: 500; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--raio-p); color: #C9C9C4; text-decoration: none; font-weight: 500; font-size: 0.92rem; }
.nav a:hover { background: #1C1C1B; color: var(--branco); }
.nav a.ativo { background: var(--vinho); color: var(--branco); }
.nav svg { width: 19px; height: 19px; flex: none; }
.nav .grupo { margin: 18px 12px 6px; font-size: var(--t-xs); color: #7D7D78; font-weight: 600; }
.lateral .rodape { margin-top: auto; padding: 14px 12px 0; border-top: 1px solid #262625; font-size: var(--t-s); }
.lateral .rodape b { color: var(--branco); display: block; font-weight: 600; }
.lateral .rodape button { margin-top: 8px; background: none; border: 0; color: #A5A5A0; padding: 0; cursor: pointer; text-decoration: underline; font-size: var(--t-xs); }

.conteudo { margin-left: var(--lateral); min-height: 100vh; display: flex; flex-direction: column; }
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--topo); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linha); display: flex; align-items: center; gap: 14px; padding: 12px 32px; }
.busca { flex: 1; max-width: 520px; position: relative; }
.busca input[type=search] { width: 100%; padding: 10px 14px 10px 42px; border: 1px solid var(--linha); background: var(--sup); border-radius: 999px; }
.busca svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--cinza); pointer-events: none; z-index: 1; }
.topo .perfil { margin-left: auto; display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--texto); font-size: var(--t-s); font-weight: 500; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--preto); color: var(--branco); display: grid; place-items: center; font-weight: 600; font-size: 0.8rem; }
.topo .mob-marca { display: none; }
main#view { padding: 32px; max-width: 1320px; width: 100%; }
.barra-mob { display: none; }

@media (max-width: 920px) {
  .lateral { display: none; }
  .conteudo { margin-left: 0; padding-bottom: 72px; }
  .topo { padding: 10px 16px; gap: 10px; }
  .topo .mob-marca { display: flex; }
  .topo .mob-marca svg { width: 28px; height: 28px; }
  .topo .perfil span { display: none; }
  .topo .btn-sim { display: none; }
  main#view { padding: 20px 16px; }
  .barra-mob { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; inset: auto 0 0 0; background: var(--preto); z-index: 30; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .barra-mob a { color: #B5B5B0; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.68rem; padding: 6px 2px; border-radius: 8px; min-height: 48px; justify-content: center; }
  .barra-mob a.ativo { color: var(--branco); background: #232322; }
  .barra-mob a.ativo svg { color: var(--vinho); }
  .barra-mob svg { width: 21px; height: 21px; }
  h1 { font-size: 1.65rem; }
  h2 { font-size: 1.35rem; }
}

/* ---------- Componentes ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 0.9rem; cursor: pointer; text-decoration: none; min-height: 42px; white-space: nowrap; background: var(--sup); color: var(--texto); border-color: var(--linha); }
.btn:hover { border-color: var(--cinza); }
.btn svg { width: 17px; height: 17px; }
.btn.prim { background: var(--vinho); color: var(--branco); border-color: var(--vinho); }
.btn.prim:hover { background: var(--vinho-escuro); }
.btn.escuro { background: var(--tinta); color: var(--sobre-tinta); border-color: var(--texto); }
.btn.link { background: none; border-color: transparent; color: var(--vinho); padding-left: 6px; padding-right: 6px; }
.btn.link:hover { text-decoration: underline; }
.btn.perigo { color: var(--vinho); }
.btn.peq { min-height: 34px; padding: 6px 11px; font-size: 0.8rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--claro); color: var(--texto); white-space: nowrap; }
.chip.vinho { background: var(--vinho-claro); color: var(--vinho-escuro); }
.chip.verde { background: var(--verde-claro); color: var(--verde); }
.chip.ambar { background: var(--ambar-claro); color: var(--ambar); }
.chip.escuro { background: var(--tinta); color: var(--sobre-tinta); }
.chip.linha { background: transparent; border: 1px solid var(--linha); color: var(--cinza); }

.painel { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); padding: 24px; }
.painel + .painel { margin-top: 20px; }
.painel > h3:first-child, .painel > .cab { margin-bottom: 16px; }
.cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.campo { display: flex; flex-direction: column; gap: 6px; }
.campo > label, .campo > .rot { font-size: var(--t-s); font-weight: 600; }
.campo .ajuda { font-size: var(--t-xs); color: var(--cinza); }
.campo .erro-campo { font-size: var(--t-xs); color: var(--vinho); font-weight: 600; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=search], input[type=tel], input:not([type]), select, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--linha); border-radius: var(--raio-p); background: var(--sup); min-height: 44px;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--vinho); box-shadow: 0 0 0 3px rgba(175,40,70,.15); }
input[readonly] { background: var(--fundo); color: var(--cinza); }
.invalido { border-color: var(--vinho) !important; }
textarea { min-height: 90px; resize: vertical; }
.grade { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 720px) { .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); } }
.dinheiro { position: relative; }
.dinheiro::before { content: 'R$'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--cinza); font-size: var(--t-s); font-weight: 500; }
.dinheiro input { padding-left: 38px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.origem { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 1px 7px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
.origem.corretor { background: var(--claro); color: var(--cinza); }
.origem.sistema { background: var(--tinta); color: var(--sobre-tinta); }
.origem.banco { background: var(--ambar-claro); color: var(--ambar); }
.origem.tabela { background: var(--vinho-claro); color: var(--vinho-escuro); }
.seg { display: inline-flex; border: 1px solid var(--linha); border-radius: 8px; padding: 3px; background: var(--fundo); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; color: var(--cinza); min-height: 36px; }
.seg button[aria-pressed=true] { background: var(--sup); color: var(--texto); box-shadow: 0 1px 2px var(--sombra); }

.alerta { border-radius: 8px; padding: 12px 14px; font-size: var(--t-s); display: flex; gap: 10px; align-items: flex-start; }
.alerta svg { width: 18px; flex: none; margin-top: 1px; }
.alerta.erro { background: var(--vinho-claro); color: var(--vinho-escuro); }
.alerta.aviso { background: var(--ambar-claro); color: var(--ambar-texto); }
.alerta.ok { background: var(--verde-claro); color: var(--verde); }
.alerta.info { background: var(--claro); color: var(--texto); }
.alerta ul { margin: 4px 0 0; padding-left: 18px; }
.lista-alertas { display: flex; flex-direction: column; gap: 8px; }

table.tab { width: 100%; border-collapse: collapse; font-size: var(--t-s); }
table.tab th { text-align: left; font-weight: 600; color: var(--cinza); font-size: var(--t-xs); padding: 10px 12px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
table.tab td { padding: 12px; border-bottom: 1px solid var(--linha-suave); vertical-align: middle; }
table.tab td.dir, table.tab th.dir { text-align: right; }
table.tab tr:hover td { background: var(--hover); }
.rolagem { overflow-x: auto; -webkit-overflow-scrolling: touch; }
@media (max-width: 720px) {
  table.resp thead { display: none; }
  table.resp tr { display: block; border: 1px solid var(--linha); border-radius: 8px; margin-bottom: 10px; padding: 6px 4px; background: var(--sup); }
  table.resp td { display: flex; justify-content: space-between; gap: 12px; border: 0; padding: 7px 10px; text-align: right; }
  table.resp td::before { content: attr(data-r); color: var(--cinza); font-size: var(--t-xs); font-weight: 600; text-align: left; }
  table.resp td.dir { text-align: right; }
  table.resp tr:hover td { background: none; }
}

#toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast { background: var(--preto); color: var(--branco); padding: 12px 16px; border-radius: 8px; font-size: var(--t-s); font-weight: 500; max-width: 360px; box-shadow: 0 6px 20px rgba(0,0,0,.18); animation: entra .2s ease-out; }
.toast.erro { background: #AF2846; }
@keyframes entra { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 920px) { #toasts { left: 12px; right: 12px; bottom: 86px; } .toast { max-width: none; } }

dialog#dialogo { border: 0; border-radius: 14px; padding: 0; max-width: 560px; width: calc(100% - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog#dialogo::backdrop { background: rgba(12,12,12,.55); }
.dlg { padding: 24px; display: flex; flex-direction: column; gap: 16px; max-height: 85vh; overflow: auto; }
.dlg .acoes { justify-content: flex-end; }

.vazio { text-align: center; padding: 56px 20px; border: 1px dashed var(--linha); border-radius: var(--raio); background: var(--sup); }
.vazio h3 { margin-bottom: 6px; }
.vazio p { color: var(--cinza); max-width: 460px; margin: 0 auto 16px; }
.esqueleto { background: linear-gradient(90deg, var(--esq1) 0%, var(--esq2) 50%, var(--esq1) 100%); background-size: 200% 100%; animation: brilho 1.3s infinite linear; border-radius: 6px; }
@keyframes brilho { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- Catálogo ---------- */
.boasvindas { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
.boasvindas h1 { max-width: 22ch; }
.boasvindas p { color: var(--cinza); margin-top: 10px; max-width: 58ch; }
.filtros { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; align-items: end; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; margin-bottom: 20px; }
.filtros .campo label { font-size: var(--t-xs); color: var(--cinza); }
.filtros select, .filtros input { min-height: 40px; padding: 8px 10px; font-size: var(--t-s); }
.filtros-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.filtros-topo .contagem { color: var(--cinza); font-size: var(--t-s); }
.btn-filtros { display: none; }
@media (max-width: 1100px) { .filtros { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 720px) { .filtros { grid-template-columns: repeat(2, minmax(0, 1fr)); display: none; } .filtros.aberto { display: grid; } .btn-filtros { display: inline-flex; } }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; }
@media (max-width: 400px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--sup); border: 1px solid var(--linha); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.card .foto { aspect-ratio: 16 / 10; background: var(--claro); position: relative; overflow: hidden; }
.card .foto img { width: 100%; height: 100%; object-fit: cover; }
.card .foto .sem { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--cinza); font-size: var(--t-s); padding: 20px; background: repeating-linear-gradient(135deg, var(--esq1) 0 12px, var(--esq2) 12px 24px); }
.card .foto .tags { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.card .foto .tags .chip { background: var(--sup); }
.card .foto .tags .chip.escuro { background: var(--tinta); }
.card .corpo { padding: 18px 18px 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card h3 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
.card h3 a { color: inherit; text-decoration: none; }
.card h3 a:hover { color: var(--vinho); }
.card .onde { color: var(--cinza); font-size: var(--t-s); }
.card .preco { margin-top: 12px; font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .preco small { display: block; font-size: var(--t-xs); color: var(--cinza); font-weight: 500; }
.specs { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 6px 18px; margin: 14px 0 0; padding: 12px 0; border-top: 1px solid var(--linha-suave); font-size: var(--t-s); }
.specs div { display: flex; flex-direction: column; }
.specs dt { font-size: 0.7rem; color: var(--cinza); }
.specs dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--t-xs); color: var(--cinza); padding-bottom: 14px; }
.card .meta b { color: var(--texto); font-weight: 600; }
.card .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 18px 18px; border-top: 1px solid var(--linha-suave); }
.card .botoes .btn { min-height: 40px; font-size: 0.8rem; padding: 8px 8px; white-space: normal; text-align: center; line-height: 1.2; min-width: 0; }
.card .botoes .btn svg { flex: none; }

/* ---------- Empreendimento ---------- */
.voltar { display: inline-flex; align-items: center; gap: 6px; color: var(--cinza); text-decoration: none; font-weight: 500; font-size: var(--t-s); margin-bottom: 16px; }
.voltar:hover { color: var(--vinho); }
.voltar svg { width: 16px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); background: var(--sup); border: 1px solid var(--linha); border-radius: 14px; overflow: hidden; }
.hero .img { background: var(--claro); min-height: 340px; position: relative; cursor: zoom-in; border: 0; padding: 0; }
.hero .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero .txt { padding: 32px; display: flex; flex-direction: column; gap: 14px; }
.hero .txt h1 { font-size: 2.25rem; }
.hero .faixa { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.hero .faixa small { display: block; font-size: var(--t-xs); color: var(--cinza); font-weight: 500; letter-spacing: 0; margin-top: 2px; }
@media (max-width: 920px) { .hero { grid-template-columns: 1fr; } .hero .img { min-height: 230px; } .hero .txt { padding: 22px; } .hero .txt h1 { font-size: 1.75rem; } }
.ancoras { display: flex; gap: 4px; overflow-x: auto; margin: 24px 0 20px; position: sticky; top: calc(62px + env(safe-area-inset-top, 0px)); z-index: 10; background: var(--fundo); padding: 8px 0; }
.ancoras a { padding: 8px 14px; border-radius: 999px; text-decoration: none; color: var(--texto); font-weight: 500; font-size: var(--t-s); white-space: nowrap; border: 1px solid var(--linha); background: var(--sup); }
.ancoras a:hover { border-color: var(--vinho); color: var(--vinho); }
.secao { scroll-margin-top: 130px; }
.ficha { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0; margin: 0; }
.ficha div { padding: 12px 0; border-bottom: 1px solid var(--linha-suave); padding-right: 16px; }
.ficha dt { font-size: var(--t-xs); color: var(--cinza); font-weight: 500; }
.ficha dd { margin: 2px 0 0; font-weight: 600; font-size: 0.95rem; }
.itens { display: flex; flex-wrap: wrap; gap: 8px; }
.itens span { background: var(--fundo); border: 1px solid var(--linha-suave); border-radius: 999px; padding: 5px 12px; font-size: var(--t-s); }
.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.galeria button { padding: 0; border: 0; background: var(--claro); border-radius: 8px; overflow: hidden; cursor: zoom-in; text-align: left; display: flex; flex-direction: column; }
.galeria img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.galeria span { display: block; font-size: var(--t-xs); padding: 7px 9px; background: var(--sup); border: 1px solid var(--linha-suave); border-top: 0; border-radius: 0 0 8px 8px; font-weight: 500; }
.filtro-cat { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.lightbox { position: fixed; inset: 0; background: rgba(8,8,8,.94); z-index: 200; display: flex; flex-direction: column; color: var(--branco); }
.lightbox .barra { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; gap: 12px; }
.lightbox .palco { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 64px 24px; min-height: 0; position: relative; }
.lightbox .palco img { max-height: 100%; max-width: 100%; object-fit: contain; }
.lightbox .nav-l { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.12); border: 0; color: var(--branco); width: 46px; height: 46px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.lightbox .nav-l:hover { background: var(--vinho); }
.lightbox .ant { left: 10px; } .lightbox .prox { right: 10px; }
.lightbox .btn { background: transparent; color: var(--branco); border-color: #444; }
@media (max-width: 720px) { .lightbox .palco { padding: 0 8px 70px; } .lightbox .nav-l { top: auto; bottom: 14px; transform: none; } .lightbox .ant { left: calc(50% - 56px); } .lightbox .prox { right: calc(50% - 56px); } }
.tipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.tipo { border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; display: flex; flex-direction: column; background: var(--sup); }
.tipo .planta { aspect-ratio: 4/3; background: var(--fundo); border: 0; padding: 0; cursor: zoom-in; }
.tipo .planta img { width: 100%; height: 100%; object-fit: contain; }
.tipo .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.tipo .area { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.docs { display: flex; flex-direction: column; }
.doc { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--linha-suave); }
.doc:last-child { border-bottom: 0; }
.doc .ic { width: 44px; height: 52px; border-radius: 6px; background: var(--fundo); border: 1px solid var(--linha); display: grid; place-items: center; font-size: 0.65rem; font-weight: 700; color: var(--vinho); }
@media (max-width: 720px) { .doc { grid-template-columns: 40px minmax(0, 1fr); } .doc .acoes { grid-column: 1 / -1; } }
.tabela-info { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-bottom: 16px; }
.tabela-info div { display: flex; flex-direction: column; }
.tabela-info span { font-size: var(--t-xs); color: var(--cinza); }
.tabela-info b { font-weight: 600; }

/* ---------- Simulador ---------- */
.passos { display: flex; gap: 0; margin: 0 0 24px; padding: 0; list-style: none; counter-reset: p; overflow-x: auto; }
.passos li { flex: 1; min-width: 108px; }
.passos button { width: 100%; border: 0; background: none; padding: 0 6px 0 0; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; color: var(--cinza); font-weight: 500; font-size: var(--t-s); }
.passos button:disabled { cursor: not-allowed; opacity: .55; }
.passos .barra { height: 4px; background: var(--linha); border-radius: 2px; width: 100%; }
.passos li.feito .barra { background: var(--tinta); }
.passos li.atual .barra { background: var(--vinho); }
.passos li.atual button { color: var(--texto); font-weight: 700; }
.passos li.feito button { color: var(--texto); }
.passos .n { font-variant-numeric: tabular-nums; }
.sim { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
.sim .lado { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 1100px) { .sim { grid-template-columns: 1fr; } .sim .lado { position: static; } }
.etapa { display: flex; flex-direction: column; gap: 20px; }
.etapa .navegar { display: flex; justify-content: space-between; gap: 10px; padding-top: 8px; flex-wrap: wrap; }
.resumo { background: var(--preto); color: var(--branco); border-radius: 12px; padding: 22px; }
.resumo h4 { color: #A9A9A4; font-size: var(--t-s); font-weight: 500; margin-bottom: 12px; }
.resumo dl { margin: 0; display: flex; flex-direction: column; }
.resumo dl div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #222; font-size: var(--t-s); }
.resumo dl div:last-child { border: 0; }
.resumo dt { color: #B8B8B3; }
.resumo dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.resumo .grande { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.resumo .status { margin-top: 14px; border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: var(--t-s); }
.resumo .status.ok { background: #183C27; color: #9FE0B8; }
.resumo .status.ajuste { background: #4A1220; color: #FFC2CF; }
.resumo-mob { display: none; }
@media (max-width: 1100px) {
  .sim .lado .resumo.fixo { display: none; }
  .resumo-mob { display: flex; position: fixed; left: 0; right: 0; bottom: 64px; z-index: 25; background: var(--preto); color: var(--branco); padding: 10px 16px; justify-content: space-between; align-items: center; gap: 12px; font-size: var(--t-s); border-top: 2px solid var(--vinho); }
  .resumo-mob b { font-variant-numeric: tabular-nums; }
  .resumo-mob button { background: none; border: 1px solid #444; color: var(--branco); border-radius: 6px; padding: 6px 10px; font-weight: 600; font-size: var(--t-xs); }
  main.simulador { padding-bottom: 80px; }
}
@media (min-width: 921px) and (max-width: 1100px) { .resumo-mob { bottom: 0; } }

/* A barra de composição: o elemento de destaque do portal */
.composicao { display: flex; flex-direction: column; gap: 12px; }
.barra-comp { display: flex; height: 46px; border-radius: 8px; overflow: hidden; background: repeating-linear-gradient(135deg, var(--vinho-claro) 0 8px, var(--vinho-claro2) 8px 16px); border: 1px solid var(--linha); }
.barra-comp i { display: block; height: 100%; transition: flex-basis .25s ease; min-width: 0; position: relative; }
.barra-comp i + i { box-shadow: inset 2px 0 0 var(--branco); }
.barra-comp .excede { background: repeating-linear-gradient(135deg, var(--vinho) 0 6px, var(--vinho-escuro) 6px 12px); }
.legenda { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px 18px; margin: 0; }
.legenda div { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: var(--t-s); padding: 6px 0; border-bottom: 1px solid var(--linha-suave); }
.legenda .cor { width: 12px; height: 12px; border-radius: 3px; }
.legenda dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.legenda .falta .cor { background: repeating-linear-gradient(135deg, var(--vinho) 0 3px, var(--vinho-claro) 3px 6px); }
.status-comp { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 8px; font-weight: 700; flex-wrap: wrap; }
.status-comp.ok { background: var(--verde-claro); color: var(--verde); }
.status-comp.ajuste { background: var(--vinho-claro); color: var(--vinho-escuro); }
.status-comp .v { font-variant-numeric: tabular-nums; }
.pergunta { border: 2px solid var(--texto); border-radius: var(--raio); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.pergunta h4 { font-size: 1.05rem; }
.contador { display: inline-flex; align-items: center; border: 1px solid var(--linha); border-radius: 8px; overflow: hidden; background: var(--sup); }
.contador button { width: 46px; height: 46px; border: 0; background: var(--fundo); font-size: 1.3rem; cursor: pointer; font-weight: 600; }
.contador button:hover { background: var(--claro); }
.contador output { min-width: 60px; text-align: center; font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.indicadores { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.indicadores div { background: var(--fundo); border-radius: 8px; padding: 12px 14px; }
.indicadores > div > span { display: block; font-size: var(--t-xs); color: var(--cinza); }
.indicadores b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; margin-top: 2px; }
.indicadores small { color: var(--cinza); font-size: var(--t-xs); }
.calc-box { background: var(--fundo); border-radius: 8px; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.calc-box > div > span:first-child { display: block; font-size: var(--t-xs); color: var(--cinza); }
.calc-box b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.def-fin { display: flex; align-items: center; justify-content: space-between; gap: 16px; border: 2px solid var(--texto); border-radius: var(--raio); padding: 18px 20px; flex-wrap: wrap; }
.def-fin .v { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

/* ---------- Admin ---------- */
.abas { display: flex; gap: 2px; border-bottom: 1px solid var(--linha); margin-bottom: 20px; overflow-x: auto; }
.abas button { border: 0; background: none; padding: 12px 16px; font-weight: 600; color: var(--cinza); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.abas button[aria-selected=true] { color: var(--texto); border-bottom-color: var(--vinho); }
.miniaturas { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.mini { border: 1px solid var(--linha); border-radius: 8px; overflow: hidden; background: var(--sup); display: flex; flex-direction: column; }
.mini img { aspect-ratio: 4/3; object-fit: cover; width: 100%; }
.mini .c { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.mini input, .mini select { min-height: 36px; padding: 6px 8px; font-size: var(--t-s); }
.pagina-cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.pagina-cab p { color: var(--cinza); margin-top: 6px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--t-s); font-weight: 500; }
.switch input { width: 40px; height: 22px; appearance: none; background: var(--linha); border-radius: 999px; position: relative; cursor: pointer; min-height: 0; padding: 0; border: 0; transition: background .15s; }
.switch input::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--sup); top: 2px; left: 2px; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background: var(--verde); }
.switch input:checked::after { left: 20px; }
code, pre { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 0.85em; }
pre { background: var(--fundo); padding: 12px; border-radius: 8px; overflow: auto; max-height: 300px; }
.senha-box { background: var(--preto); color: var(--branco); padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: 600; letter-spacing: .03em; text-align: center; user-select: all; }

/* ===== Camada "tech": visual escuro, vidro, brilho vinho e movimento =====
   Layout: shell com lateral de vidro sobre um campo de grade animada; conteúdo em painéis translúcidos.
   Paleta e tipografia: */
:root {
  --bg: #06060A;
  --fundo: #06060A;
  --sup: rgba(255, 255, 255, .045);
  --sup-forte: rgba(18, 18, 26, .86);
  --texto: #EEEEF4;
  --cinza: #9C9CAA;
  --claro: rgba(255, 255, 255, .08);
  --linha: rgba(255, 255, 255, .10);
  --linha-suave: rgba(255, 255, 255, .06);
  --hover: rgba(255, 255, 255, .04);
  --topo: rgba(6, 6, 10, .72);
  --esq1: rgba(255, 255, 255, .05);
  --esq2: rgba(255, 255, 255, .10);
  --vinho: #E2365F;
  --vinho-base: #AF2846;
  --vinho-escuro: #FF5A80;
  --vinho-claro: rgba(226, 54, 95, .16);
  --vinho-claro2: rgba(226, 54, 95, .08);
  --brilho: rgba(226, 54, 95, .55);
  --ciano: #7CE7FF;
  --verde: #4BE38F;
  --verde-claro: rgba(75, 227, 143, .13);
  --ambar: #FFC85A;
  --ambar-claro: rgba(255, 200, 90, .13);
  --ambar-texto: #FFD98A;
  --tinta: #EEEEF4;
  --sobre-tinta: #0A0A0F;
  --preto: #0A0A0F;
  --sombra: rgba(0, 0, 0, .55);
  --cor-sinal: #E2365F;
  --cor-fgts: #7CE7FF;
  --cor-mensais: #9C9CAA;
  --cor-anuais: #FF8FB0;
  --cor-subsidio: #5E5E6E;
  --cor-recursos: #C9C9D6;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --curva: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}

body { background: var(--bg); color: var(--texto); }
#fx-fundo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#app, #toasts { position: relative; z-index: 1; }
::selection { background: var(--vinho); color: #fff; }

/* números com cara de painel */
.valor, .num, .card .preco, .hero .faixa, .resumo .grande, .def-fin .v, .calc-box b, .indicadores b, .tipo .area, .status-comp .v, .contador output, .kpi b {
  font-family: var(--mono); letter-spacing: -0.02em;
}

/* ---------- Estrutura em vidro ---------- */
.lateral { background: rgba(8, 8, 13, .72); backdrop-filter: blur(18px) saturate(140%); border-right: 1px solid var(--linha); }
.nav a { position: relative; transition: background .25s var(--curva), color .25s, transform .25s var(--curva); }
.nav a:hover { background: rgba(255, 255, 255, .05); transform: translateX(3px); }
.nav a.ativo { background: linear-gradient(90deg, rgba(226, 54, 95, .30), rgba(226, 54, 95, .06)); color: #fff; box-shadow: inset 0 0 0 1px rgba(226, 54, 95, .35); }
.nav a.ativo::before { content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--vinho); box-shadow: 0 0 12px var(--brilho); }
.topo { background: var(--topo); backdrop-filter: blur(16px) saturate(140%); border-bottom: 1px solid var(--linha); }
.busca input[type=search] { background: rgba(255, 255, 255, .05); border-color: var(--linha); color: var(--texto); transition: border-color .25s, box-shadow .25s, background .25s; }
.busca input[type=search]:focus { background: rgba(255, 255, 255, .08); box-shadow: 0 0 0 3px rgba(226, 54, 95, .25), 0 0 24px rgba(226, 54, 95, .25); }
.barra-mob { background: rgba(8, 8, 13, .86); backdrop-filter: blur(18px); border-top: 1px solid var(--linha); }
.barra-mob a.ativo { background: rgba(226, 54, 95, .18); }

.painel, .card, .tipo, .vazio, .filtros, .mini, .hero {
  background: linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .025));
  border: 1px solid var(--linha);
  backdrop-filter: blur(14px) saturate(130%);
}
.painel { position: relative; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=search], input[type=tel], input:not([type]), select, textarea {
  background: rgba(255, 255, 255, .04); border-color: var(--linha); color: var(--texto);
  transition: border-color .2s, box-shadow .2s, background .2s;
}
input:focus, select:focus, textarea:focus { background: rgba(255, 255, 255, .07); box-shadow: 0 0 0 3px rgba(226, 54, 95, .22), 0 0 22px rgba(226, 54, 95, .18); }
input[readonly] { background: rgba(255, 255, 255, .02); }
select option { background: #12121A; color: var(--texto); }
.dinheiro::before { color: var(--cinza); }

/* ---------- Botões com brilho ---------- */
.btn { background: rgba(255, 255, 255, .05); border-color: var(--linha); color: var(--texto); position: relative; overflow: hidden; transition: transform .2s var(--curva), border-color .2s, box-shadow .25s, background .2s; }
.btn:hover { border-color: rgba(255, 255, 255, .28); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.btn.prim { background: linear-gradient(135deg, #F04670, #AF2846); border-color: transparent; color: #fff; box-shadow: 0 6px 22px -6px var(--brilho); }
.btn.prim:hover { box-shadow: 0 10px 32px -6px var(--brilho), 0 0 0 1px rgba(255, 255, 255, .12) inset; background: linear-gradient(135deg, #FF5A80, #C22F51); }
.btn.prim::after, .btn.escuro::after { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .35), transparent); transform: skewX(-18deg); transition: left .6s var(--curva); pointer-events: none; }
.btn.prim:hover::after, .btn.escuro:hover::after { left: 130%; }
.btn.escuro { background: #EEEEF4; color: #0A0A0F; border-color: transparent; }
.btn.link { background: transparent; border-color: transparent; color: var(--vinho-escuro); }
.btn.link:hover { transform: none; }
.btn .onda { position: absolute; border-radius: 50%; transform: scale(0); background: rgba(255, 255, 255, .35); animation: onda .6s linear; pointer-events: none; }
@keyframes onda { to { transform: scale(4); opacity: 0; } }
.seg { background: rgba(255, 255, 255, .04); border-color: var(--linha); }
.seg button { color: var(--cinza); transition: background .25s var(--curva), color .2s; }
.seg button[aria-pressed=true] { background: rgba(226, 54, 95, .22); color: #fff; box-shadow: 0 0 0 1px rgba(226, 54, 95, .45) inset, 0 0 18px rgba(226, 54, 95, .25); }

.chip { background: rgba(255, 255, 255, .08); color: var(--texto); border: 1px solid rgba(255, 255, 255, .08); }
.chip.escuro { background: rgba(124, 231, 255, .12); color: var(--ciano); border-color: rgba(124, 231, 255, .25); }
.chip.vinho { background: var(--vinho-claro); color: #FF8FAA; border-color: rgba(226, 54, 95, .3); }
.chip.verde { background: var(--verde-claro); color: var(--verde); border-color: rgba(75, 227, 143, .3); }
.chip.ambar { background: var(--ambar-claro); color: var(--ambar); border-color: rgba(255, 200, 90, .3); }
.chip.linha { border-color: var(--linha); color: var(--cinza); background: transparent; }
.origem.sistema { background: rgba(124, 231, 255, .14); color: var(--ciano); }
.origem.corretor { background: rgba(255, 255, 255, .08); color: var(--cinza); }
.origem.tabela { background: var(--vinho-claro); color: #FF8FAA; }

/* ---------- Entrada das telas ---------- */
@keyframes surgir { from { opacity: 0; transform: translateY(18px) scale(.985); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
#view > * { animation: surgir .6s var(--curva) backwards; animation-delay: calc(var(--i, 0) * 70ms); }
.cards > .card, .tipos > .tipo, .galeria > button, .docs > .doc, .legenda > div, .kpis > div, .indicadores > div, .calc-box > div, .ficha > div {
  animation: surgir .55s var(--curva) backwards; animation-delay: calc(var(--i, 0) * 55ms + 120ms);
}
::view-transition-old(root) { animation: .28s var(--curva) both sair-tela; }
::view-transition-new(root) { animation: .45s var(--curva) both entrar-tela; }
@keyframes sair-tela { to { opacity: 0; transform: translateX(-24px) scale(.99); filter: blur(6px); } }
@keyframes entrar-tela { from { opacity: 0; transform: translateX(28px) scale(.99); filter: blur(6px); } }

/* ---------- Catálogo ---------- */
.boasvindas { position: relative; padding: 34px 32px; border-radius: 18px; overflow: hidden; border: 1px solid var(--linha);
  background: radial-gradient(120% 140% at 0% 0%, rgba(226, 54, 95, .28), transparent 55%), radial-gradient(90% 120% at 100% 100%, rgba(124, 231, 255, .12), transparent 60%), rgba(255, 255, 255, .03); }
.boasvindas::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 0 calc(100% - 1px), rgba(255, 255, 255, .06) 0) 0 0 / 100% 22px, linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(255, 255, 255, .06) 0) 0 0 / 22px 100%;
  mask-image: radial-gradient(80% 90% at 70% 40%, #000, transparent 75%); -webkit-mask-image: radial-gradient(80% 90% at 70% 40%, #000, transparent 75%); pointer-events: none; }
.boasvindas > * { position: relative; z-index: 1; }
.boasvindas h1 { font-size: clamp(2rem, 4.2vw, 3.4rem); max-width: 18ch; line-height: 1.05; letter-spacing: -0.035em; }
.boasvindas p { color: #C4C4D0; }
.palavra { display: inline-block; opacity: 0; transform: translateY(.6em) rotateX(60deg); transform-origin: 50% 100%; animation: palavra .7s var(--curva) forwards; animation-delay: calc(var(--w) * 65ms + 150ms); }
@keyframes palavra { to { opacity: 1; transform: none; } }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 22px; }
.kpi { position: relative; padding: 16px 18px; border-radius: 14px; border: 1px solid var(--linha); background: rgba(255, 255, 255, .035); overflow: hidden; }
.kpi::before { content: ''; position: absolute; left: 0; top: 0; height: 2px; width: 100%; background: linear-gradient(90deg, var(--vinho), transparent); }
.kpi b { display: block; font-size: 1.9rem; font-weight: 600; color: #fff; }
.kpi span { color: var(--cinza); font-size: var(--t-s); }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .boasvindas { padding: 24px 18px; } }

.card { position: relative; border-radius: 16px; transform-style: preserve-3d; transition: transform .35s var(--curva), box-shadow .35s var(--curva), border-color .3s; will-change: transform; }
.card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2; opacity: 0; transition: opacity .3s;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(226, 54, 95, .18), transparent 45%); }
.card:hover { border-color: rgba(226, 54, 95, .45); box-shadow: 0 24px 60px -24px rgba(226, 54, 95, .45), 0 0 0 1px rgba(226, 54, 95, .15); }
.card:hover::before { opacity: 1; }
.card .foto { background: #0E0E14; }
.card .foto img { transition: transform .8s var(--curva), filter .5s; filter: saturate(1.05) contrast(1.03); }
.card:hover .foto img { transform: scale(1.07); }
.card .foto::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(6, 6, 10, .85)); pointer-events: none; }
.card .foto .sem { background: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 12px, rgba(255,255,255,.07) 12px 24px); color: var(--cinza); }
.card .foto .tags { z-index: 1; }
.card .foto .tags .chip { background: rgba(10, 10, 15, .72); color: #fff; backdrop-filter: blur(6px); border-color: rgba(255, 255, 255, .15); }
.card .foto .tags .chip.escuro { background: rgba(226, 54, 95, .85); border-color: transparent; }
.card .corpo, .card .botoes { position: relative; z-index: 3; }
.card .preco { color: #fff; }
.specs { border-top-color: var(--linha-suave); }
.card .botoes { border-top-color: var(--linha-suave); }
.cmp { position: absolute; right: 12px; top: 12px; z-index: 4; border: 1px solid rgba(255, 255, 255, .25); background: rgba(10, 10, 15, .7); color: #fff; backdrop-filter: blur(6px);
  border-radius: 999px; padding: 5px 11px; font: inherit; font-size: .74rem; font-weight: 600; cursor: pointer; transition: background .2s, border-color .2s, transform .2s var(--curva); }
.cmp:hover { transform: scale(1.05); }
.cmp[aria-pressed=true] { background: var(--vinho); border-color: transparent; box-shadow: 0 0 18px var(--brilho); }
.filtros { border-radius: 14px; }
.filtros .campo label { color: var(--cinza); }

/* barra do comparador */
#cmp-barra { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); z-index: 40; display: flex; gap: 12px; align-items: center; padding: 10px 12px 10px 18px;
  border-radius: 999px; background: rgba(14, 14, 20, .9); border: 1px solid rgba(226, 54, 95, .45); box-shadow: 0 20px 50px -10px rgba(0,0,0,.7), 0 0 30px rgba(226, 54, 95, .25); backdrop-filter: blur(14px);
  transition: transform .45s var(--curva), opacity .3s, visibility 0s .45s; font-size: var(--t-s); white-space: nowrap; max-width: calc(100% - 32px); opacity: 0; visibility: hidden; pointer-events: none; }
#cmp-barra.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto; transition: transform .45s var(--curva), opacity .3s; }
@media (max-width: 920px) { #cmp-barra { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } }
.cmp-tab th, .cmp-tab td { padding: 12px 14px; border-bottom: 1px solid var(--linha-suave); text-align: left; vertical-align: top; font-size: var(--t-s); }
.cmp-tab th { color: var(--cinza); font-weight: 500; white-space: nowrap; }
.cmp-tab td b { font-family: var(--mono); }
.cmp-tab td.melhor b { color: var(--verde); }
.cmp-tab thead th { color: #fff; font-weight: 700; font-size: 1rem; }

/* ---------- Página do empreendimento ---------- */
.hero { border-radius: 18px; }
.hero .img { background: #0E0E14; overflow: hidden; }
.hero .img img { transition: transform 1.2s var(--curva); }
.hero .img:hover img { transform: scale(1.04); }
.hero .img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 60%, rgba(6, 6, 10, .55)); pointer-events: none; }
.hero .faixa { color: #fff; }
.ancoras { background: transparent; }
.ancoras a { background: rgba(14, 14, 20, .75); backdrop-filter: blur(10px); border-color: var(--linha); color: var(--texto); transition: border-color .2s, color .2s, box-shadow .2s; }
.ancoras a:hover { border-color: var(--vinho); color: #fff; box-shadow: 0 0 16px rgba(226, 54, 95, .3); }
.itens span { background: rgba(255, 255, 255, .04); border-color: var(--linha); transition: border-color .2s, transform .2s var(--curva); }
.itens span:hover { border-color: rgba(226, 54, 95, .5); transform: translateY(-2px); }
.galeria button { background: #0E0E14; border-radius: 12px; transition: transform .3s var(--curva), box-shadow .3s; }
.galeria button:hover { transform: translateY(-4px); box-shadow: 0 16px 30px -12px rgba(226, 54, 95, .4); }
.galeria img { transition: transform .6s var(--curva); }
.galeria button:hover img { transform: scale(1.06); }
.galeria span { background: rgba(14, 14, 20, .9); border-color: var(--linha-suave); }
.tipo { border-radius: 14px; transition: transform .3s var(--curva), border-color .3s, box-shadow .3s; }
.tipo:hover { transform: translateY(-4px); border-color: rgba(226, 54, 95, .45); box-shadow: 0 20px 40px -20px rgba(226, 54, 95, .45); }
.tipo .planta { background: #F3F3F6; }
.tipo .area { color: #fff; }
.doc .ic { background: rgba(226, 54, 95, .12); border-color: rgba(226, 54, 95, .35); color: #FF8FAA; }
table.tab th { color: var(--cinza); border-bottom-color: var(--linha); }
table.tab td { border-bottom-color: var(--linha-suave); }
table.tab tbody tr { transition: background .2s; }
table.tab tr:hover td { background: rgba(226, 54, 95, .06); }
.lightbox { background: rgba(4, 4, 8, .92); backdrop-filter: blur(10px); animation: abrir .35s var(--curva); }
.lightbox .palco img { animation: zoom-in .45s var(--curva); border-radius: 8px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
@keyframes abrir { from { opacity: 0; } }
@keyframes zoom-in { from { opacity: 0; transform: scale(.92); filter: blur(6px); } }

/* ---------- Simulador ---------- */
.passos .barra { height: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; position: relative; }
.passos li.feito .barra { background: var(--vinho-base); }
.passos li.atual .barra { background: linear-gradient(90deg, var(--vinho), #FF8FAA, var(--vinho)); background-size: 200% 100%; animation: fluxo 1.8s linear infinite; box-shadow: 0 0 14px var(--brilho); }
@keyframes fluxo { to { background-position: -200% 0; } }
.passos li.atual button { color: #fff; }
.resumo { background: linear-gradient(180deg, rgba(20, 20, 30, .92), rgba(10, 10, 16, .92)); border: 1px solid rgba(226, 54, 95, .3); box-shadow: 0 30px 60px -30px rgba(226, 54, 95, .45); backdrop-filter: blur(16px); }
.resumo .grande { color: #fff; }
.resumo dl div { border-bottom-color: rgba(255, 255, 255, .07); }
.resumo .status.ok { background: rgba(75, 227, 143, .12); color: var(--verde); box-shadow: 0 0 0 1px rgba(75, 227, 143, .3) inset; animation: pulso 2.4s ease-in-out infinite; }
.resumo .status.ajuste { background: rgba(226, 54, 95, .15); color: #FF8FAA; box-shadow: 0 0 0 1px rgba(226, 54, 95, .35) inset; }
@keyframes pulso { 50% { box-shadow: 0 0 0 1px rgba(75, 227, 143, .45) inset, 0 0 24px rgba(75, 227, 143, .25); } }
.resumo-mob { background: rgba(10, 10, 16, .92); backdrop-filter: blur(14px); }
.calc-box, .indicadores > div { background: rgba(255, 255, 255, .035); border: 1px solid var(--linha-suave); }
.calc-box b, .indicadores b { color: #fff; }
.def-fin, .pergunta { border-color: rgba(226, 54, 95, .45); background: radial-gradient(120% 140% at 0 0, rgba(226, 54, 95, .14), transparent 60%); box-shadow: 0 0 0 1px rgba(226, 54, 95, .1), 0 18px 40px -24px rgba(226, 54, 95, .5); }
.def-fin .v { color: #fff; text-shadow: 0 0 24px rgba(226, 54, 95, .45); }
.contador { background: rgba(255, 255, 255, .04); border-color: var(--linha); }
.contador button { background: rgba(255, 255, 255, .06); color: var(--texto); transition: background .2s, color .2s; }
.contador button:hover { background: var(--vinho); color: #fff; }
.barra-comp { height: 54px; border-radius: 10px; border-color: var(--linha); background: repeating-linear-gradient(135deg, rgba(226, 54, 95, .18) 0 8px, rgba(226, 54, 95, .06) 8px 16px); background-size: 200% 200%; animation: listras 3s linear infinite; }
@keyframes listras { to { background-position: 45px 0; } }
.barra-comp i { transition: flex-basis .7s var(--curva); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
.barra-comp i + i { box-shadow: inset 2px 0 0 #06060A, inset 0 1px 0 rgba(255, 255, 255, .25); }
.barra-comp i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .25), transparent); transform: translateX(-100%); animation: varrer 2.6s var(--curva) infinite; }
@keyframes varrer { 60%, 100% { transform: translateX(100%); } }
.legenda div { border-bottom-color: var(--linha-suave); }
.status-comp.ok { background: rgba(75, 227, 143, .1); color: var(--verde); box-shadow: 0 0 0 1px rgba(75, 227, 143, .3) inset, 0 0 30px -6px rgba(75, 227, 143, .35); }
.status-comp.ajuste { background: rgba(226, 54, 95, .12); color: #FF8FAA; box-shadow: 0 0 0 1px rgba(226, 54, 95, .35) inset; }
.alerta.erro { background: rgba(226, 54, 95, .12); color: #FFB3C4; border: 1px solid rgba(226, 54, 95, .3); }
.alerta.aviso { background: rgba(255, 200, 90, .1); color: var(--ambar-texto); border: 1px solid rgba(255, 200, 90, .25); }
.alerta.ok { background: rgba(75, 227, 143, .1); color: var(--verde); border: 1px solid rgba(75, 227, 143, .25); }
.alerta.info { background: rgba(124, 231, 255, .08); color: #CFF6FF; border: 1px solid rgba(124, 231, 255, .2); }

/* controles deslizantes */
input[type=range].slider { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; padding: 0; border: 0; min-height: 0; box-shadow: none; margin-top: 6px; }
input[type=range].slider::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--vinho) var(--p, 0%), rgba(255, 255, 255, .1) var(--p, 0%)); }
input[type=range].slider::-moz-range-track { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .1); }
input[type=range].slider::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--vinho); }
input[type=range].slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: #fff; border: 3px solid var(--vinho); box-shadow: 0 0 0 4px rgba(226, 54, 95, .2), 0 0 16px var(--brilho); cursor: grab; transition: transform .15s; }
input[type=range].slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid var(--vinho); box-shadow: 0 0 16px var(--brilho); cursor: grab; }
input[type=range].slider:active::-webkit-slider-thumb { transform: scale(1.2); cursor: grabbing; }
input[type=range].slider:focus { box-shadow: none; background: transparent; }

/* ---------- Diversos ---------- */
.toast { background: rgba(16, 16, 24, .95); border: 1px solid rgba(124, 231, 255, .25); color: #fff; box-shadow: 0 16px 40px rgba(0, 0, 0, .6), 0 0 24px rgba(124, 231, 255, .12); animation: toast-in .45s var(--curva); backdrop-filter: blur(12px); }
.toast.erro { background: rgba(40, 10, 18, .95); border-color: rgba(226, 54, 95, .5); box-shadow: 0 16px 40px rgba(0,0,0,.6), 0 0 24px rgba(226, 54, 95, .3); }
@keyframes toast-in { from { opacity: 0; transform: translateX(30px) scale(.96); } }
dialog#dialogo { background: rgba(16, 16, 24, .96); color: var(--texto); border: 1px solid var(--linha); box-shadow: 0 30px 80px rgba(0, 0, 0, .7), 0 0 40px rgba(226, 54, 95, .15); }
dialog#dialogo[open] { animation: zoom-in .35s var(--curva); }
dialog#dialogo::backdrop { background: rgba(2, 2, 6, .7); backdrop-filter: blur(6px); }
.vazio { border-style: solid; }
.avatar { background: var(--vinho); }
.pagina-cab h1 { letter-spacing: -0.03em; }
.marca svg rect:first-child { fill: #15151D; }
.senha-box { background: #15151D; }
.switch input { background: rgba(255,255,255,.15); }
.esqueleto { background: linear-gradient(90deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,.1) 50%, rgba(255,255,255,.04) 100%); background-size: 200% 100%; }
a { color: var(--vinho-escuro); }

@media (prefers-reduced-motion: reduce) {
  .palavra { opacity: 1; transform: none; }
  .card, .card:hover { transform: none !important; }
}
.sim-img { max-height: 70vh; overflow: auto; border-radius: 12px; border: 1px solid var(--linha); background: #fff; }
.sim-img img { display: block; width: 100%; height: auto; -webkit-touch-callout: default; user-select: auto; }

/* ===== Página do empreendimento como experiência ===== */
main#view.emp-view { padding-top: 0; }
.exp { display: flex; flex-direction: column; gap: 28px; }
.exp-hero { position: relative; margin: 0 -32px; min-height: min(78vh, 720px); display: flex; align-items: flex-end; overflow: hidden; border-bottom: 1px solid var(--linha); }
.exp-hero-img { position: absolute; inset: 0; cursor: zoom-in; }
.exp-hero-img img { width: 100%; height: 115%; object-fit: cover; transform: scale(1.06); will-change: transform; animation: kenburns 18s ease-in-out infinite alternate; }
@keyframes kenburns { to { object-position: 60% 40%; } }
.exp-sem { position: absolute; inset: 0; background: radial-gradient(80% 90% at 20% 20%, rgba(226, 54, 95, .35), transparent 60%), #0B0B12; }
.exp-hero::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 6, 10, .25) 0%, rgba(6, 6, 10, .1) 35%, rgba(6, 6, 10, .85) 78%, var(--bg) 100%), linear-gradient(90deg, rgba(6, 6, 10, .75), transparent 65%); }
.exp-hero-txt { position: relative; z-index: 1; padding: 40px 32px 48px; display: flex; flex-direction: column; gap: 14px; max-width: 760px; }
.exp-hero-txt .voltar { color: #D6D6E0; margin: 0; }
.exp-hero h1 { font-size: clamp(2.4rem, 6vw, 4.6rem); line-height: .98; letter-spacing: -0.045em; text-shadow: 0 6px 40px rgba(0, 0, 0, .5); }
.exp-onde { color: #D6D6E0; font-size: 1.05rem; }
.exp-preco { display: inline-flex; flex-direction: column; align-self: flex-start; padding: 12px 18px; border-radius: 14px; background: rgba(10, 10, 16, .55); border: 1px solid rgba(255, 255, 255, .14); backdrop-filter: blur(12px); }
.exp-preco span { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; color: #fff; letter-spacing: -0.02em; }
.exp-preco small { color: var(--cinza); font-size: var(--t-xs); max-width: 46ch; }
.exp-rolar { position: absolute; right: 32px; bottom: 32px; z-index: 1; background: rgba(10, 10, 16, .5); color: #fff; border: 1px solid rgba(255, 255, 255, .2); border-radius: 999px; padding: 10px 18px 10px 38px; font: inherit; font-weight: 600; font-size: .85rem; cursor: pointer; backdrop-filter: blur(8px); }
.exp-rolar::before { content: ''; position: absolute; left: 16px; top: 50%; width: 10px; height: 10px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-75%) rotate(45deg); animation: seta 1.4s ease-in-out infinite; }
@keyframes seta { 50% { transform: translateY(-30%) rotate(45deg); } }

.exp-nav { position: sticky; top: calc(62px + env(safe-area-inset-top, 0px)); z-index: 12; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 6px; margin-top: -20px; border-radius: 999px;
  background: rgba(10, 10, 16, .94); border: 1px solid var(--linha); backdrop-filter: blur(16px); box-shadow: 0 10px 30px -10px rgba(0,0,0,.8); align-self: flex-start; max-width: 100%; }
.exp-nav::-webkit-scrollbar { display: none; }
.exp-nav a { position: relative; z-index: 1; padding: 8px 14px; border-radius: 999px; color: var(--cinza); text-decoration: none; font-size: var(--t-s); font-weight: 600; white-space: nowrap; transition: color .25s; }
.exp-nav a.ativo, .exp-nav a:hover { color: #fff; }
.exp-nav-ind { position: absolute; z-index: 0; top: 6px; bottom: 6px; left: 0; border-radius: 999px; background: linear-gradient(135deg, rgba(226, 54, 95, .55), rgba(175, 40, 70, .55)); box-shadow: 0 0 18px var(--brilho); transition: transform .45s var(--curva), width .45s var(--curva); }

.exp-destaques { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; border-top: 1px solid var(--linha); border-bottom: 1px solid var(--linha); }
.exp-destaques div { padding: 22px 20px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.exp-destaques div + div::before { content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 1px; background: var(--linha); }
.exp-destaques b { font-family: var(--mono); font-size: clamp(1.4rem, 2.6vw, 2.1rem); font-weight: 600; color: #fff; letter-spacing: -0.03em; }
.exp-destaques span { color: var(--cinza); font-size: var(--t-s); }
.exp-intro p { font-size: clamp(1.05rem, 1.6vw, 1.3rem); line-height: 1.6; max-width: 62ch; color: #DADAE4; }
.exp-sec { scroll-margin-top: 140px; display: flex; flex-direction: column; gap: 16px; }
.exp-cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.exp-cab h2 { font-size: clamp(1.5rem, 3vw, 2.2rem); letter-spacing: -0.035em; }
.exp-texto { color: #D2D2DC; max-width: 70ch; }
.revelar.pre { opacity: 0; transform: translateY(28px); filter: blur(6px); transition: opacity .8s var(--curva), transform .8s var(--curva), filter .8s var(--curva); }
.revelar.pre.visto { opacity: 1; transform: none; filter: none; }

.exp-pilulas { display: flex; gap: 6px; flex-wrap: wrap; }
.exp-pilulas button { border: 1px solid var(--linha); background: rgba(255, 255, 255, .04); color: var(--cinza); border-radius: 999px; padding: 7px 13px; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; transition: all .25s var(--curva); }
.exp-pilulas button:hover { color: #fff; border-color: rgba(255, 255, 255, .3); }
.exp-pilulas button[aria-pressed=true] { background: var(--vinho); border-color: transparent; color: #fff; box-shadow: 0 0 16px var(--brilho); }
.exp-pilulas em { font-style: normal; font-family: var(--mono); background: rgba(75, 227, 143, .2); color: var(--verde); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
.exp-pilulas button[aria-pressed=true] em { background: rgba(255, 255, 255, .25); color: #fff; }

/* carrossel */
.carrossel { display: grid; grid-auto-flow: column; grid-auto-columns: min(78%, 560px); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 4px 2px 14px; scrollbar-width: thin; cursor: grab; }
.carrossel.arrastando { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; }
.slide { scroll-snap-align: start; position: relative; border: 0; padding: 0; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; background: #0E0E14; cursor: zoom-in; box-shadow: 0 0 0 1px var(--linha); transition: transform .4s var(--curva), box-shadow .4s; }
.slide:hover { transform: translateY(-4px); box-shadow: 0 0 0 1px rgba(226, 54, 95, .5), 0 20px 40px -20px rgba(226, 54, 95, .5); }
.slide img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--curva); user-select: none; -webkit-user-drag: none; pointer-events: none; }
.slide:hover img { transform: scale(1.05); }
.slide span { position: absolute; left: 12px; bottom: 12px; right: 12px; text-align: left; color: #fff; font-weight: 600; font-size: .88rem; text-shadow: 0 2px 10px rgba(0, 0, 0, .8); }
.slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(0, 0, 0, .7)); pointer-events: none; }
.slide span { z-index: 1; }
.carrossel-ctl { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.carrossel-ctl .btn { min-height: 38px; padding: 6px 10px; }
.carrossel-ctl span { font-family: var(--mono); min-width: 70px; text-align: center; }

/* lazer */
.lazer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 18px; align-items: stretch; }
.lazer-lista { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.lazer-item { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--linha); background: rgba(255, 255, 255, .04); color: var(--texto); border-radius: 12px; padding: 10px 14px; font: inherit; font-size: .9rem; font-weight: 500; cursor: pointer; transition: all .25s var(--curva); }
.lazer-item i { font-style: normal; font-size: .55rem; color: var(--vinho); }

<script>
/*
 * Motor de cálculo do simulador (compartilhado entre servidor e navegador).
 *
 * Regras vindas do "Simulador MCMV" do Franco (nota "Preferência - Simulador MCMV"):
 *  - Prestação sempre pela Tabela Price.
 *  - Financiamento calculado sobre o VALOR DE AVALIAÇÃO e limitado pela renda.
 *  - Entrada = valor de venda − valor financiado.
 *  - Se o sinal passar de 70% da entrada, não prever as parcelas anuais (padrão: 3).
 *  - Cada parcela anual ≤ 80% da renda familiar mensal (salvo regra comercial do empreendimento).
 *  - Sem lógica de venda: usar taxa e prazo máximos do parâmetro MCMV selecionado.
 *
 * O servidor sempre recalcula: o valor gravado é o do servidor, nunca o do navegador.
 */
(function (root, factory) {

    sinalLimiteAnuaisPct: 0.7,    // sinal > 70% da entrada → não prever anuais
    maxAnuais: null,              // null = sem limite cadastrado
    maxMensais: null,

    fonte: 'Simulador MCMV (regras do Franco, out/2026)'

  const r2 = (v) => Math.round((Number(v) + Number.EPSILON) * 100) / 100;
  const num = (v) => {
    if (v === null || v === undefined || v === '') return 0;
    const s = String(v).trim();
    const n = typeof v === 'number' ? v : Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s);
    return Number.isFinite(n) ? n : NaN;
  };
  const int = (v) => {
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? n : 0;
  };

  function taxaMensal(taxaAnualPct) {

    return num(taxaAnualPct) / 100 / 12;
  }

  function pmtPrice(pv, i, n) {
    if (!(pv > 0) || !(n > 0)) return 0;
    if (i === 0) return pv / n;
    return (pv * i) / (1 - Math.pow(1 + i, -n));
  }

  function pvPrice(pmt, i, n) {
    if (!(pmt > 0) || !(n > 0)) return 0;
    if (i === 0) return pmt * n;
